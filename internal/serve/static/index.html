<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Council 只读看板</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #f8f9fb;
    --line: #e7e9ee;
    --line-strong: #d7dae1;
    --ink: #15171c;
    --ink-2: #3c424e;
    --muted: #6b7383;
    --muted-2: #98a0ae;
    --accent: #3a5bd9;
    --accent-soft: #eef1fd;
    --warn: #a9660b;
    --warn-soft: #fcf2e2;
    --danger: #c0392b;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0b0d11;
      --surface: #11141a;
      --surface-2: #171b22;
      --line: #222733;
      --line-strong: #2f3542;
      --ink: #e9ecf2;
      --ink-2: #c3c9d6;
      --muted: #8b93a3;
      --muted-2: #6c7484;
      --accent: #8ea6ff;
      --accent-soft: #1a2133;
      --warn: #e2a95f;
      --warn-soft: #2a2117;
      --danger: #ef8074;
      --shadow: 0 1px 2px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.5 -apple-system, "Segoe UI Variable Text", "Segoe UI",
          "Microsoft YaHei UI", "PingFang SC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb {
    background: var(--line-strong);
    border: 3px solid transparent;
    background-clip: content-box;
    border-radius: 999px;
  }
  #app { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100vh; }

  /* 顶栏：一条实线收口，不做卡片 */
  .topbar {
    display: flex;
    align-items: center;
    gap: 14px;
    height: 54px;
    padding: 0 18px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 600; letter-spacing: .01em; }
  .brand::before {
    content: "";
    width: 18px; height: 18px;
    border-radius: 6px;
    background: linear-gradient(140deg, var(--accent), #7d8cff);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25);
  }
  .brand small {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 8px;
  }
  .status { color: var(--danger); font-size: 12px; }
  .status[hidden] { display: none; }
  .cost { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .cost-note { font-size: 11.5px; color: var(--muted); }
  .cost-note.warn { color: var(--warn); background: var(--warn-soft); border-radius: 999px; padding: 2px 8px; }
  .cost-value { font-size: 15px; font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }

  /* 三栏工作区：靠 1px 分割线分区，栏内各自滚动 */
  .workspace { display: grid; grid-template-columns: 288px minmax(0, 1fr) 352px; min-height: 0; }
  .sidebar, .inspector, .conversation { display: flex; flex-direction: column; min-height: 0; }
  .sidebar { background: var(--surface); border-right: 1px solid var(--line); }
  .inspector { background: var(--surface); border-left: 1px solid var(--line); }
  .conversation { background: var(--bg); }
  .side-head, .conv-head {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 46px;
    padding: 0 14px;
    flex: none;
    border-bottom: 1px solid var(--line);
  }
  .side-head h2, .conv-head h2 {
    margin: 0;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .conv-head h2 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0;
    text-transform: none;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #refresh-conversations {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px; height: 26px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
  }
  #refresh-conversations:hover { color: var(--ink); border-color: var(--line-strong); }
  .side-scroll, .conv-scroll { flex: 1; min-height: 0; overflow: auto; }
  .side-scroll { padding: 8px; }
  .conv-scroll { padding: 14px 8px 28px; }

  /* 会话列表 */
  #conversation-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .conversation {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 3px;
    width: 100%;
    padding: 9px 10px 9px 12px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .conversation:hover { background: var(--surface-2); }
  .conversation.active { background: var(--accent-soft); }
  .conversation.active::before {
    content: "";
    position: absolute;
    left: 3px; top: 9px; bottom: 9px;
    width: 3px;
    border-radius: 3px;
    background: var(--accent);
  }
  .conversation .title {
    font-size: 13px;
    font-weight: 550;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .conversation .meta { font-size: 11.5px; color: var(--muted); }

  /* 消息流：没有气泡，靠头像色与留白区分 */
  #message-list {
    list-style: none;
    margin: 0 auto;
    padding: 0;
    max-width: 860px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .message {
    display: grid;
    grid-template-columns: 26px minmax(0, 1fr);
    gap: 12px;
    padding: 13px 14px;
    border-radius: 10px;
  }
  .message + .message { box-shadow: 0 -1px 0 var(--line); border-radius: 0; }
  .message:hover { background: var(--surface); }
  .avatar {
    width: 26px; height: 26px;
    border-radius: 8px;
    display: grid;
    place-items: center;
    font-size: 11px;
    font-weight: 650;
    color: #fff;
    background: hsl(var(--hue, 220) 52% 50%);
    user-select: none;
  }
  .avatar.neutral { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 22%, transparent); }
  .msg-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 1px; }
  .who { font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .kind {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--muted);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 0 5px;
  }
  .msg-head time { font-size: 11px; color: var(--muted-2); font-variant-numeric: tabular-nums; }
  .msg-text {
    max-width: 76ch;
    font-size: 14.5px;
    line-height: 1.72;
    color: var(--ink-2);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  /* 成员与费用 */
  #members-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  #members-table thead th {
    position: sticky;
    top: -8px;
    background: var(--surface);
    padding: 6px 6px 8px;
    text-align: right;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--muted-2);
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  #members-table thead th:first-child { text-align: left; }
  #members-table tbody td { padding: 9px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  #members-table tbody tr:last-child td { border-bottom: 0; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
  .member-name { font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .member-sub { margin-top: 2px; font-size: 11px; color: var(--muted); }
  tr.inactive .member-name { color: var(--muted); }

  .empty {
    margin: 32px 12px;
    font-size: 12.5px;
    line-height: 1.7;
    color: var(--muted);
    text-align: center;
  }


  /* 写模式底栏 */
  .ask {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px 16px 14px;
    background: var(--surface);
    border-top: 1px solid var(--line);
  }
  .ask[hidden] { display: none; }
  .ask-progress {
    max-height: 108px;
    overflow: auto;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface-2);
    font-size: 11.5px;
    color: var(--muted);
  }
  .ask-progress[hidden] { display: none; }
  .ask-line { white-space: pre-wrap; overflow-wrap: anywhere; }
  .ask-row { display: flex; align-items: flex-end; gap: 10px; }
  .ask-members {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-width: 46%;
    max-height: 42px;
    overflow: auto;
    font-size: 12px;
  }
  .ask-members label {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 9px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--ink-2);
    white-space: nowrap;
    cursor: pointer;
  }
  .ask-members input { margin: 0; accent-color: var(--accent); }
  .ask-hint { font-size: 11.5px; color: var(--muted); }
  #ask-prompt {
    flex: 1;
    min-height: 42px;
    max-height: 160px;
    resize: vertical;
    padding: 10px 12px;
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    background: var(--surface-2);
    color: var(--ink);
    font: inherit;
    font-size: 13.5px;
    line-height: 1.6;
  }
  #ask-prompt:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #ask-run {
    height: 42px;
    padding: 0 20px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
  }
  #ask-run:hover { filter: brightness(1.06); }
  #ask-run:disabled { opacity: .5; cursor: default; filter: none; }
  .ask-error { color: var(--danger); font-size: 12px; }
  .ask-error[hidden] { display: none; }

  @media (max-width: 1180px) {
    .workspace { grid-template-columns: 250px minmax(0, 1fr); }
    .inspector { display: none; }
  }
  @media (max-width: 820px) {
    .workspace { grid-template-columns: minmax(0, 1fr); }
    .sidebar { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">Council <small>只读看板</small></div>
    <div id="status" class="status" hidden></div>
    <div class="cost">
      <span class="cost-note" id="cost-note"></span>
      <span class="cost-value" id="cost-value">—</span>
    </div>
  </header>
  <main class="workspace">
    <aside class="sidebar">
      <div class="side-head">
        <h2>会话</h2>
        <button id="refresh-conversations" type="button" title="重新读一次会话列表" aria-label="刷新会话列表">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <path d="M12.6 6.2A5 5 0 1 0 13 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M13.4 3.3v3.1H10.3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <div class="side-scroll">
        <ul id="conversation-list"></ul>
        <p id="conversations-empty" class="empty" hidden>还没有会话，先在终端里跑一次 council</p>
      </div>
    </aside>

    <section class="conversation">
      <div class="conv-head"><h2 id="messages-title">消息</h2></div>
      <div class="conv-scroll">
        <ol id="message-list"></ol>
        <p id="messages-empty" class="empty" hidden></p>
      </div>
    </section>

    <aside class="inspector">
      <div class="side-head"><h2>成员与费用</h2></div>
      <div class="side-scroll">
        <table id="members-table">
          <thead>
            <tr>
              <th>成员</th>
              <th>轮</th>
              <th>IN</th>
              <th>OUT</th>
              <th>金额</th>
            </tr>
          </thead>
          <tbody id="members-body"></tbody>
        </table>
        <p id="members-empty" class="empty" hidden>这个会话还没有成员</p>
      </div>
    </aside>
  </main>

  <section id="ask-panel" class="ask" hidden>
    <div id="ask-progress" class="ask-progress" hidden></div>
    <div class="ask-error" id="ask-error" hidden></div>
    <div class="ask-row">
      <div id="ask-members" class="ask-members"></div>
      <textarea id="ask-prompt" rows="2" placeholder="问这一次议会一个问题…"></textarea>
      <button id="ask-run" type="button">跑一轮</button>
    </div>
  </section>
</div>
<script>
(() => {
  'use strict';

  // 消息面板与账仍靠每 3 秒拉一次增量（SRV1 §5）；SSE 只服务写模式的
  // 任务进度，不改变读侧的轮询节奏。
  // 用 setTimeout 串行排队而不是 setInterval：一次请求慢于 3 秒时，
  // setInterval 会叠加出多个在飞请求，慢接口会把看板拖成一串重复渲染。
  const POLL_MS = 3000;
  const PAGE_LIMIT = 1000;

  const state = {
    conversations: [],
    currentId: null,
    lastSeq: 0,
    detail: null,
    timer: null,
    // 写模式（council serve -rw）才为 true，由 /api/health 的 writable
    // 决定。只读模式下这些字段保持默认，底栏整块 hidden。
    writable: false,
    askRunning: false,
    askSource: null,
  };

  const conversationList = document.getElementById('conversation-list');
  const conversationsEmpty = document.getElementById('conversations-empty');
  const messageList = document.getElementById('message-list');
  const messagesEmpty = document.getElementById('messages-empty');
  const messagesTitle = document.getElementById('messages-title');
  const membersBody = document.getElementById('members-body');
  const membersEmpty = document.getElementById('members-empty');
  const costValue = document.getElementById('cost-value');
  const costNote = document.getElementById('cost-note');
  const statusLine = document.getElementById('status');
  const brandNote = document.querySelector('.brand small');
  const askPanel = document.getElementById('ask-panel');
  const askMembers = document.getElementById('ask-members');
  const askPrompt = document.getElementById('ask-prompt');
  const askRun = document.getElementById('ask-run');
  const askProgress = document.getElementById('ask-progress');
  const askError = document.getElementById('ask-error');

  function api(path) {
    return fetch(path, { headers: { Accept: 'application/json' } }).then((res) => {
      return res.text().then((text) => {
        let body = null;
        if (text) {
          try {
            body = JSON.parse(text);
          } catch (err) {
            throw new Error('接口返回的不是 JSON');
          }
        }
        if (!res.ok) {
          throw new Error((body && body.error) || ('HTTP ' + res.status));
        }
        return body;
      });
    });
  }

  // postJSON 是写模式唯一会改状态的请求。错误体与只读接口同一个
  // {"error":"…"} 形状，所以能直接复用 api() 的展示逻辑。
  function postJSON(path, payload) {
    return fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify(payload),
    }).then((res) => res.text().then((text) => {
      let body = null;
      if (text) {
        try {
          body = JSON.parse(text);
        } catch (err) {
          throw new Error('接口返回的不是 JSON');
        }
      }
      if (!res.ok) {
        throw new Error((body && body.error) || ('HTTP ' + res.status));
      }
      return body;
    }));
  }

  function showError(err) {
    statusLine.textContent = '连接出错：' + err.message;
    statusLine.hidden = false;
  }

  function clearError() {
    statusLine.hidden = true;
    statusLine.textContent = '';
  }

  function statusText(status) {
    switch (status) {
      case 'ok': return '成功';
      case 'partial': return '部分成功';
      case 'budget_exceeded': return '预算触线';
      case 'error': return '出错';
      default: return status || '未知';
    }
  }

  function showAskError(message) {
    askError.textContent = message;
    askError.hidden = false;
  }

  function clearAskError() {
    askError.textContent = '';
    askError.hidden = true;
  }

  function appendAskProgress(text) {
    const line = document.createElement('div');
    line.className = 'ask-line';
    line.textContent = text;
    askProgress.appendChild(line);
    askProgress.hidden = false;
    askProgress.scrollTop = askProgress.scrollHeight;
  }

  function setAskRunning(running) {
    state.askRunning = running;
    askRun.disabled = running;
    askRun.textContent = running ? '运行中…' : '跑一轮';
  }

  function closeJobStream() {
    if (state.askSource) {
      state.askSource.close();
      state.askSource = null;
    }
  }

  // 成员多选来自当前会话的活跃成员；一个都没选时后端按「配置里的全部
  // agent」处理，与 council ask 不带 -members 同口径。没有会话可选时只
  // 显示提示，不假装有一个空名单。
  function renderAskMembers() {
    askMembers.replaceChildren();
    if (!state.writable) return;
    const members = ((state.detail && state.detail.members) || [])
      .filter((member) => member.active);
    if (members.length === 0) {
      const hint = document.createElement('span');
      hint.className = 'ask-hint';
      hint.textContent = '不选成员＝配置里的全部 agent';
      askMembers.appendChild(hint);
      return;
    }
    for (const member of members) {
      const label = document.createElement('label');
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.value = member.agent_id;
      input.checked = true;
      label.appendChild(input);
      label.appendChild(document.createTextNode(member.display_name || member.agent_id));
      askMembers.appendChild(label);
    }
  }

  function selectedAskMembers() {
    return Array.from(askMembers.querySelectorAll('input[type="checkbox"]'))
      .filter((input) => input.checked)
      .map((input) => input.value);
  }

  async function loadHealth() {
    try {
      const health = await api('/api/health');
      state.writable = health && health.writable === true;
    } catch (err) {
      state.writable = false;
    }
    askPanel.hidden = !state.writable;
    if (state.writable) {
      // 只读模式的标题与空库文案一个字都不动；写模式把「只读」改成
      // 事实，免得用户看着「只读看板」不敢在下面输入。
      brandNote.textContent = '写模式';
      document.title = 'Council 写模式';
      conversationsEmpty.textContent = '还没有会话，问一句就会新建';
      renderAskMembers();
    }
  }

  // subscribeJob 把一次任务的一生接到页面上。done 之后主动 close：
  // 服务端在任务结束后会关流，EventSource 默认会把它当成断线并自动
  // 重连、把整段历史再放一遍；主动关闭才是「已完成」的正确收尾。
  function subscribeJob(jobID) {
    closeJobStream();
    const source = new EventSource('/api/jobs/' + encodeURIComponent(jobID) + '/events');
    state.askSource = source;

    source.addEventListener('started', (event) => {
      let data = null;
      try {
        data = JSON.parse(event.data);
      } catch (err) {
        showAskError('started 事件不是合法 JSON');
        return;
      }
      if (!data.conversation_id) return;
      appendAskProgress('开始 · 会话 ' + data.conversation_id);
      // started 一到就切到新会话：议会跑的过程中，消息面板会按原来的
      // 轮询节奏把新落库的消息补进来。
      state.currentId = data.conversation_id;
      renderConversationList();
      api('/api/conversations').then((list) => {
        state.conversations = list;
        renderConversationList();
        if (state.currentId === data.conversation_id) {
          selectConversation(data.conversation_id);
        }
      }).catch(showError);
    });

    source.addEventListener('turn', (event) => {
      try {
        const data = JSON.parse(event.data);
        appendAskProgress((data.agent_id || '?') + ' · ' + (data.outcome || '?') +
          ' · ' + formatUSD(data.cost_usd));
      } catch (err) {
        // 单帧坏掉不该停掉整条流，也不值得把连接错误的状态条打红。
      }
    });

    source.addEventListener('done', (event) => {
      let data = null;
      try {
        data = JSON.parse(event.data);
      } catch (err) {
        showAskError('done 事件不是合法 JSON');
      }
      if (data) {
        appendAskProgress('完成 · ' + statusText(data.status) + ' · ' +
          formatUSD(data.cost_usd) + ' · 失败 ' + data.failed + '/' + data.total);
        if (data.summary) appendAskProgress('汇总：' + data.summary);
      }
      closeJobStream();
      setAskRunning(false);
      refreshConversations();
    });

    source.addEventListener('error', (event) => {
      // 服务端主动发的 error 带 data；EventSource 自己的连接错误没有
      // data。后一种交给浏览器按 Last-Event-ID 自动重连（服务端保留
      // 60 秒事件历史），所以这里只在确有消息时展示原因，不动按钮：
      // 解锁由紧随其后的 done 负责。
      if (!event.data) return;
      let message = '议会出错';
      try {
        message = JSON.parse(event.data).message || message;
      } catch (err) {
        // 保留兜底文案。
      }
      showAskError(message);
      appendAskProgress('错误 · ' + message);
    });
  }

  async function runAsk() {
    if (!state.writable || state.askRunning) return;
    const prompt = askPrompt.value.trim();
    if (!prompt) {
      showAskError('先写一句要问的问题');
      askPrompt.focus();
      return;
    }
    clearAskError();
    askProgress.replaceChildren();
    askProgress.hidden = true;
    appendAskProgress('已提交，等待会话开始…');
    setAskRunning(true);
    try {
      const reply = await postJSON('/api/ask', {
        prompt: prompt,
        members: selectedAskMembers(),
        rounds: 1,
      });
      subscribeJob(reply.job_id);
    } catch (err) {
      setAskRunning(false);
      showAskError(err.message);
    }
  }

  // 表格里一列塞不下 "0.0421 USD"：USD 由表头说明，值只留数字。
  function formatUSD(value) {
    if (typeof value !== 'number' || !isFinite(value)) return '—';
    return '$' + value.toFixed(4);
  }
  function formatUSDFull(value) {
    if (typeof value !== 'number' || !isFinite(value)) return '—';
    return value.toFixed(4) + ' USD';
  }

  function formatNumber(value) {
    return typeof value === 'number' && isFinite(value) ? value.toLocaleString('zh-CN') : '0';
  }

  // 记录里时间戳是次要信息：今天的消息只显示时分，跨天的才带日期。
  // 每条都写全年月日会把眼睛从正文上拽走。
  function formatTime(value) {
    if (!value) return '';
    const date = new Date(value);
    if (isNaN(date.getTime())) return value;
    const clock = date.toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit' });
    const now = new Date();
    const sameDay = date.getFullYear() === now.getFullYear()
      && date.getMonth() === now.getMonth()
      && date.getDate() === now.getDate();
    if (sameDay) return clock;
    return date.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' }) + ' ' + clock;
  }

  // sender 着色：同一 id 永远得到同一个色相；user / system 是保留 id，
  // 固定用中性色，避免把「人」和某个成员混成一种颜色。
  function senderHue(senderID) {
    if (senderID === 'user' || senderID === 'system') return null;
    let hash = 0;
    for (let i = 0; i < senderID.length; i += 1) {
      hash = (hash * 31 + senderID.charCodeAt(i)) >>> 0;
    }
    return hash % 360;
  }

  // 消息行：头像色只用来区分「谁」，正文才是主角。kind 只在它带来额外
  // 信息时显示——给一条 agent 消息再标一遍 "agent" 是重复。
  function renderMessage(message) {
    const article = document.createElement('article');
    const isUser = message.sender_id === 'user';
    const hue = senderHue(message.sender_id);
    article.className = 'message' + (isUser ? ' is-user' : '');

    const avatar = document.createElement('div');
    avatar.className = 'avatar' + (hue === null ? ' neutral' : '');
    if (hue !== null) avatar.style.setProperty('--hue', String(hue));
    const who = message.sender_id || '';
    avatar.textContent = isUser ? '你' : (who.slice(0, 1) || '?').toUpperCase();
    article.appendChild(avatar);

    const body = document.createElement('div');
    const head = document.createElement('div');
    head.className = 'msg-head';

    // 用户的头像已经写着「你」，名字再写一遍就是重复；成员才需要名字。
    if (!isUser) {
      const name = document.createElement('span');
      name.className = 'who';
      name.textContent = who || '(未知)';
      head.appendChild(name);
    }

    const kindName = String(message.kind || '').replace(/[^a-z_]/g, '');
    if (kindName && kindName !== 'user' && kindName !== 'agent') {
      const kind = document.createElement('span');
      kind.className = 'kind';
      kind.textContent = kindName;
      head.appendChild(kind);
    }

    const time = document.createElement('time');
    time.textContent = formatTime(message.created_at);
    head.appendChild(time);
    body.appendChild(head);

    if (message.text) {
      const text = document.createElement('div');
      text.className = 'msg-text';
      text.textContent = message.text;
      body.appendChild(text);
    }

    article.appendChild(body);
    return article;
  }

  function appendMessages(messages, initial) {
    if (!messages || messages.length === 0) return;
    const wasAtBottom = messageList.scrollHeight - messageList.scrollTop - messageList.clientHeight < 40;
    let appended = 0;
    for (const message of messages) {
      // 按 seq 去重：切会话或两个请求竞态时，同一页可能被追加两次；
      // 重复渲染既会让人以为多了消息，也会把左侧条数加错。
      if (typeof message.seq === 'number' && message.seq <= state.lastSeq) continue;
      messageList.appendChild(renderMessage(message));
      appended += 1;
      if (typeof message.seq === 'number' && message.seq > state.lastSeq) {
        state.lastSeq = message.seq;
      }
    }
    if (appended === 0) return;
    messagesEmpty.hidden = true;
    // 轮询到新消息时顺手更新左侧当前会话那一行，不必为了条数与最后活动
    // 再拉一次整个会话列表。初始加载不更新：那份列表本来就是刚读的。
    if (!initial) {
      const conversation = state.conversations.find((item) => item.id === state.currentId);
      if (conversation) {
        conversation.message_count += appended;
        conversation.last_seq = state.lastSeq;
        conversation.last_activity = messages[messages.length - 1].created_at;
        renderConversationList();
      }
    }
    if (initial || wasAtBottom) {
      messageList.scrollTop = messageList.scrollHeight;
    }
  }

  function renderConversationList() {
    conversationList.replaceChildren();
    for (const conversation of state.conversations) {
      const item = document.createElement('li');
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'conversation' + (conversation.id === state.currentId ? ' active' : '');
      button.dataset.conversationId = conversation.id;

      const title = document.createElement('span');
      title.className = 'title';
      title.textContent = conversation.title || '(无标题)';
      button.appendChild(title);

      const meta = document.createElement('span');
      meta.className = 'meta';
      const bits = [];
      bits.push(conversation.members + ' 人');
      bits.push(conversation.message_count + ' 条');
      if (conversation.last_activity) bits.push(formatTime(conversation.last_activity));
      meta.textContent = bits.join(' · ');
      button.appendChild(meta);

      button.addEventListener('click', () => {
        if (conversation.id !== state.currentId) selectConversation(conversation.id);
      });
      item.appendChild(button);
      conversationList.appendChild(item);
    }
    conversationsEmpty.hidden = state.conversations.length > 0;
  }

  function renderCost(usage) {
    if (!usage) {
      costValue.textContent = '—';
      costNote.textContent = '';
      costNote.className = 'cost-note';
      return;
    }
    costValue.textContent = formatUSDFull(usage.cost_usd);
    if (usage.complete) {
      costNote.textContent = '金额完整';
      costNote.className = 'cost-note';
    } else {
      costNote.textContent = '金额不完整';
      costNote.title = '有成员的 provider 不报金额，合计只是报了金额的那些轮之和';
      costNote.className = 'cost-note warn';
    }
  }

  function addCell(row, text, className) {
    const cell = document.createElement('td');
    if (className) cell.className = className;
    cell.textContent = text;
    row.appendChild(cell);
  }

  function renderMembers(detail, usage) {
    membersBody.replaceChildren();

    const members = (detail && detail.members) || [];
    const perAgent = (usage && usage.per_agent) || [];
    const byAgent = new Map();
    for (const member of members) byAgent.set(member.agent_id, member);
    for (const row of perAgent) {
      if (!byAgent.has(row.agent_id)) byAgent.set(row.agent_id, null);
    }

    const ids = Array.from(byAgent.keys()).sort();
    if (ids.length === 0) {
      membersEmpty.hidden = false;
      return;
    }
    membersEmpty.hidden = true;

    const usageById = new Map();
    for (const row of perAgent) usageById.set(row.agent_id, row);

    for (const id of ids) {
      const member = byAgent.get(id);
      const row = document.createElement('tr');
      if (member && !member.active) row.className = 'inactive';

      const memberCell = document.createElement('td');
      const name = document.createElement('div');
      name.className = 'member-name';
      name.textContent = (member && member.display_name) || id;
      memberCell.appendChild(name);
      const sub = document.createElement('div');
      sub.className = 'member-sub';
      const provider = (member && member.provider) || (usageById.get(id) || {}).provider || '';
      const model = (usageById.get(id) || {}).model || '';
      const stat = usageById.get(id) || {};
      const suffix = member && !member.active ? ' · 已退出' : '';
      const cacheBits = [];
      if (stat.cache_create) cacheBits.push('建 ' + formatNumber(stat.cache_create));
      if (stat.cache_read) cacheBits.push('读 ' + formatNumber(stat.cache_read));
      const cacheNote = cacheBits.length ? '缓存 ' + cacheBits.join(' / ') : '';
      sub.textContent = [id, provider, model, cacheNote].filter(Boolean).join(' · ') + suffix;
      memberCell.appendChild(sub);
      row.appendChild(memberCell);

      addCell(row, String(stat.turns || 0), 'num');
      addCell(row, formatNumber(stat.in), 'num');
      addCell(row, formatNumber(stat.out), 'num');
      addCell(row, stat.cost_reported === false ? '不报' : formatUSD(stat.cost_usd || 0), 'num');
      membersBody.appendChild(row);
    }
  }

  function resetToEmptyLibrary() {
    state.currentId = null;
    state.lastSeq = 0;
    state.detail = null;
    state.conversations = [];
    renderConversationList();
    messageList.replaceChildren();
    messagesTitle.textContent = '消息';
    // 只读模式下的原文案保持不动；写模式可以直接在下面新建会话，
    // 再让用户「先去终端跑一次」就是把唯一的入口藏起来。
    messagesEmpty.textContent = state.writable
      ? '还没有会话，在下面问一句就会新建一个'
      : '还没有会话，先在终端里跑一次 council';
    messagesEmpty.hidden = false;
    membersBody.replaceChildren();
    membersEmpty.hidden = true;
    renderCost(null);
    renderAskMembers();
  }

  async function selectConversation(id) {
    // 切会话先停掉已排队的轮询：旧 timer 若在这一页请求完成前触发，会用
    // 新的 currentId 配 lastSeq=0 再拉一遍第一页，和这里撞车。
    stopPolling();
    state.currentId = id;
    state.lastSeq = 0;
    state.detail = null;
    renderConversationList();
    messageList.replaceChildren();
    messagesEmpty.hidden = true;
    membersBody.replaceChildren();
    membersEmpty.hidden = true;
    renderCost(null);

    const encoded = encodeURIComponent(id);
    // 三份数据各管各的面板：usage 挂了不该让消息也停更，所以不用
    // Promise.all（它把任何一个失败变成整体失败）。
    const [detailRes, usageRes, pageRes] = await Promise.allSettled([
      api('/api/conversations/' + encoded),
      api('/api/conversations/' + encoded + '/usage'),
      api('/api/conversations/' + encoded + '/messages?after=0&limit=' + PAGE_LIMIT),
    ]);
    if (state.currentId !== id) return;
    let failed = false;
    if (detailRes.status === 'fulfilled') {
      state.detail = detailRes.value;
      messagesTitle.textContent = detailRes.value.title || '(无标题)';
      // 只有真的换了会话才重画成员勾选：轮询里不调它，否则每次刷新都会
      // 把用户手动取消的勾选恢复成全选。
      renderAskMembers();
    } else {
      failed = true;
      showError(detailRes.reason);
    }
    if (usageRes.status === 'fulfilled') {
      renderCost(usageRes.value);
      if (detailRes.status === 'fulfilled') {
        renderMembers(detailRes.value, usageRes.value);
      }
    } else {
      failed = true;
      showError(usageRes.reason);
    }
    if (pageRes.status === 'fulfilled') {
      const page = pageRes.value;
      if (page.messages.length === 0) {
        messagesEmpty.textContent = '这个会话还没有消息';
        messagesEmpty.hidden = false;
      } else {
        appendMessages(page.messages, true);
      }
      if (typeof page.last_seq === 'number' && page.last_seq > state.lastSeq) {
        state.lastSeq = page.last_seq;
      }
    } else {
      failed = true;
      showError(pageRes.reason);
    }
    if (!failed) clearError();
    schedulePoll();
  }

  async function refreshConversations() {
    try {
      const list = await api('/api/conversations');
      state.conversations = list;
      renderConversationList();
      if (list.length === 0) {
        resetToEmptyLibrary();
        return;
      }
      if (!state.currentId || !list.some((conversation) => conversation.id === state.currentId)) {
        await selectConversation(list[0].id);
      }
      clearError();
    } catch (err) {
      showError(err);
    }
  }

  async function pollOnce() {
    state.timer = null;
    if (document.hidden) return;
    const id = state.currentId;
    if (!id) {
      schedulePoll();
      return;
    }
    const encoded = encodeURIComponent(id);
    const [pageRes, usageRes] = await Promise.allSettled([
      api('/api/conversations/' + encoded + '/messages?after=' +
        encodeURIComponent(String(state.lastSeq)) + '&limit=' + PAGE_LIMIT),
      api('/api/conversations/' + encoded + '/usage'),
    ]);
    if (state.currentId !== id) {
      schedulePoll();
      return;
    }
    let failed = false;
    if (usageRes.status === 'fulfilled') {
      renderCost(usageRes.value);
      renderMembers(state.detail, usageRes.value);
    } else {
      failed = true;
      showError(usageRes.reason);
    }
    if (pageRes.status === 'fulfilled') {
      appendMessages(pageRes.value.messages, false);
      if (typeof pageRes.value.last_seq === 'number' && pageRes.value.last_seq > state.lastSeq) {
        state.lastSeq = pageRes.value.last_seq;
      }
    } else {
      failed = true;
      showError(pageRes.reason);
    }
    if (!failed) clearError();
    schedulePoll();
  }

  function schedulePoll() {
    if (state.timer !== null || document.hidden) return;
    state.timer = window.setTimeout(pollOnce, POLL_MS);
  }

  function stopPolling() {
    if (state.timer !== null) {
      window.clearTimeout(state.timer);
      state.timer = null;
    }
  }

  document.getElementById('refresh-conversations').addEventListener('click', () => {
    refreshConversations();
  });

  askRun.addEventListener('click', () => {
    runAsk();
  });

  // Ctrl/Cmd+Enter 直接提交；单独 Enter 留给换行——问题经常不止一句。
  askPrompt.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
      event.preventDefault();
      runAsk();
    }
  });

  // 页面隐藏时停掉轮询，回到前台立刻补一次再继续；任务书 §5 要求
  // 中途能停，这比在隐藏页里空转省电，也避免后台标签页攒一堆请求。
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      stopPolling();
      return;
    }
    refreshConversations();
    pollOnce();
  });

  // health 先问一次：只有写模式才把底栏放出来。health 失败按只读处理，
  // 看板本来的四个端点照常工作，不必因为一个可选能力把整页变红。
  loadHealth().then(() => refreshConversations()).then(() => {
    if (state.currentId) schedulePoll();
  });
})();
</script>
</body>
</html>
