<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Council 只读看板</title>
<style>
  /* 设计令牌照 deepseek-harness 的那一套：中性偏冷的灰阶（neutral-bluish）、
     几乎不可见的描边（黑/白 6%–12% 的透明度，而不是实心灰线）、近黑作为
     品牌色、蓝色只做交互强调。圆角比常见后台大一档。 */
  :root {
    color-scheme: light;
    --bg: #f9fafb;
    --surface: #ffffff;
    --surface-2: #f1f3f5;
    --surface-3: #e9ecf2;
    --bubble: #f1f3f5;
    --line: rgba(0, 0, 0, .06);
    --line-strong: rgba(0, 0, 0, .12);
    --ink: #0f1115;
    --ink-2: #43454a;
    --muted: #61666b;
    --muted-2: #81858c;
    --brand: #0f1115;
    --brand-ink: #ffffff;
    --accent: #3b82f6;
    --accent-soft: #eff6ff;
    --warn: #b45309;
    --warn-soft: #fef5e7;
    --danger: #ec1313;
    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 16px;
    --shadow: 0 1px 2px rgba(15, 17, 21, .04), 0 8px 24px -18px rgba(15, 17, 21, .28);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #151517;
      --surface: #1b1b1c;
      --surface-2: #232324;
      --surface-3: #2c2c2e;
      --bubble: #2c2c2e;
      --line: rgba(255, 255, 255, .07);
      --line-strong: rgba(255, 255, 255, .14);
      --ink: #f9fafb;
      --ink-2: #cfd2d8;
      --muted: #979da6;
      --muted-2: #81858c;
      --brand: #f9fafb;
      --brand-ink: #0f1115;
      --accent: #4d93f8;
      --accent-soft: #17233a;
      --warn: #f7ad31;
      --warn-soft: #2a2118;
      --danger: #f25a5a;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -18px rgba(0, 0, 0, .8);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb {
    background: var(--line-strong);
    border: 3px solid transparent;
    background-clip: content-box;
    border-radius: 999px;
  }
  ::selection { background: var(--accent-soft); color: var(--ink); }
  #app { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100vh; }

  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 52px;
    padding: 0 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  .brand::before {
    content: "";
    width: 18px; height: 18px;
    border-radius: 6px;
    background: var(--brand);
  }
  .brand small {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 8px;
  }
  .status { color: var(--danger); font-size: 12px; }
  .status[hidden] { display: none; }
  .cost { margin-left: 10px; display: flex; align-items: center; gap: 10px; }
  .cost-note { font-size: 12px; color: var(--muted); }
  .cost-note.warn { color: var(--warn); background: var(--warn-soft); border-radius: 999px; padding: 3px 9px; }
  .cost-value { font-size: 15px; font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }

  .workspace { display: grid; grid-template-columns: 288px minmax(0, 1fr) 352px; min-height: 0; }
  .sidebar, .inspector, .conversation { display: flex; flex-direction: column; min-height: 0; }
  .sidebar { background: var(--surface); border-right: 1px solid var(--line); }
  .inspector { background: var(--surface); border-left: 1px solid var(--line); }
  .conversation { background: var(--bg); }

  .side-head, .conv-head {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 46px;
    padding: 0 14px;
    flex: none;
    border-bottom: 1px solid var(--line);
  }
  .side-head h2 {
    margin: 0;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--muted-2);
  }
  .conv-head h2 {
    margin: 0;
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: -.01em;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #refresh-conversations {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px; height: 28px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    transition: background .12s ease, color .12s ease;
  }
  #refresh-conversations:hover { background: var(--surface-2); color: var(--ink); }
  /* 搜索框常驻在列表上方：它是过滤，不是一次性的查找，滚动列表时也不该跟着走。 */
  .side-search {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: none;
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
  }
  .side-search input {
    flex: 1;
    min-width: 0;
    padding: 5px 9px;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-sm);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-size: 12.5px;
  }
  .side-search input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .side-search input::placeholder { color: var(--muted-2); }
  .side-count {
    flex: none;
    font-size: 11.5px;
    color: var(--muted-2);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .side-count[hidden] { display: none; }
  .side-scroll, .conv-scroll { flex: 1; min-height: 0; overflow: auto; }
  .side-scroll { padding: 8px; }
  .conv-scroll { padding: 16px 10px 32px; }

  #conversation-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  #conversation-list > li { position: relative; }
  .conversation {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 3px;
    width: 100%;
    padding: 9px 10px 9px 12px;
    border: 0;
    border-radius: var(--r-sm);
    background: transparent;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
    transition: background .12s ease;
  }
  /* 标题右侧让出 ⋯ 的位置，长标题不会从按钮下面露出来。 */
  #conversation-list > li > .conversation { padding-right: 34px; }
  .conversation:hover { background: var(--surface-2); }
  .conversation.active { background: var(--surface-2); }
  .conversation.active::before {
    content: "";
    position: absolute;
    left: 3px; top: 10px; bottom: 10px;
    width: 3px;
    border-radius: 3px;
    background: var(--brand);
  }
  .conversation .title {
    font-size: 13px;
    font-weight: 550;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .conversation .meta { font-size: 11.5px; color: var(--muted-2); }

  /* 每项右侧的「⋯」：会话级动作（本片只有重命名）都收在这里，
     列表本身保持「点一下切会话」这一个主操作。 */
  .conv-more {
    position: absolute;
    top: 5px;
    right: 4px;
    width: 24px;
    height: 24px;
    padding: 0;
    border: 0;
    border-radius: var(--r-sm);
    background: transparent;
    color: var(--muted-2);
    font: inherit;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    opacity: .55;
    transition: background .12s ease, color .12s ease, opacity .12s ease;
  }
  .conv-more:hover,
  .conv-more[aria-expanded="true"] { opacity: 1; background: var(--surface-2); color: var(--ink); }
  .conv-menu {
    position: absolute;
    top: 30px;
    right: 4px;
    z-index: 15;
    min-width: 116px;
    padding: 4px;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-sm);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  /* 靠近列表底边时向上翻：.side-scroll 会裁掉溢出内容，菜单不能跟着被切。 */
  .conv-menu.up { top: auto; bottom: 30px; }
  .conv-menu[hidden] { display: none; }
  .conv-menu .menu-item { font-size: 12.5px; padding: 6px 8px; }

  /* 原地改名的输入框。它替换整行（不是叠在按钮里）：input 放进 button
     既不合语义，点击也会被「切换会话」抢走。 */
  .rename-box {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 6px 8px;
    border-radius: var(--r-sm);
    background: var(--surface-2);
  }
  .rename-box input {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--accent);
    border-radius: var(--r-sm);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-size: 13px;
  }
  .rename-box input:focus {
    outline: none;
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .rename-hint { font-size: 11px; color: var(--muted-2); }
  .rename-error { font-size: 11px; line-height: 1.5; color: var(--danger); }
  .rename-error[hidden] { display: none; }

  #message-list {
    list-style: none;
    margin: 0 auto;
    padding: 0;
    max-width: 840px;
    display: flex;
    flex-direction: column;
  }
  .message {
    display: grid;
    grid-template-columns: 28px minmax(0, 1fr);
    gap: 12px;
    padding: 14px 12px;
    border-radius: var(--r-md);
  }
  .message + .message { box-shadow: 0 -1px 0 var(--line); border-radius: 0; }
  .message:not(.is-user):hover { background: var(--surface); }
  /* 用户的话是气泡、成员的话是正文：两种消息如果长得一样，对话的走向就没了。 */
  .message.is-user { grid-template-columns: minmax(0, 1fr); padding-left: 56px; box-shadow: none !important; }
  .message.is-user .msg-body {
    justify-self: end;
    width: fit-content;
    max-width: 78%;
    padding: 10px 14px;
    border-radius: var(--r-lg);
    background: var(--bubble);
  }
  .message.is-user .msg-head { justify-content: flex-end; margin-bottom: 3px; }
  .message.is-user .msg-text { max-width: none; color: var(--ink); }
  .avatar {
    width: 28px; height: 28px;
    border-radius: 9px;
    display: grid;
    place-items: center;
    font-size: 11.5px;
    font-weight: 650;
    color: #fff;
    background: hsl(var(--hue, 220) 42% 46%);
    user-select: none;
  }
  .avatar.neutral {
    background: var(--surface-2);
    color: var(--muted);
    box-shadow: inset 0 0 0 1px var(--line);
  }
  .msg-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
  .who { font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .kind {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .03em;
    text-transform: uppercase;
    color: var(--muted-2);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0 5px;
  }
  .msg-head time { font-size: 11.5px; color: var(--muted-2); font-variant-numeric: tabular-nums; }
  .msg-text {
    max-width: 76ch;
    font-size: 14.5px;
    line-height: 1.75;
    color: var(--ink-2);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  #members-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  #members-table thead th {
    position: sticky;
    top: -8px;
    background: var(--surface);
    padding: 6px 6px 8px;
    text-align: right;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--muted-2);
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  #members-table thead th:first-child { text-align: left; }
  #members-table tbody td { padding: 9px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  #members-table tbody tr:last-child td { border-bottom: 0; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
  .member-name { font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .member-sub { margin-top: 2px; font-size: 11px; color: var(--muted-2); }
  tr.inactive .member-name { color: var(--muted); }

  .empty { margin: 34px 12px; font-size: 12.5px; line-height: 1.7; color: var(--muted-2); text-align: center; }

  .ask {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px 16px 14px;
    background: var(--surface);
    border-top: 1px solid var(--line);
  }
  .ask[hidden] { display: none; }
  .ask-progress {
    max-height: 108px;
    overflow: auto;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    background: var(--surface-2);
    font-size: 11.5px;
    color: var(--muted);
  }
  .ask-progress[hidden] { display: none; }
  .ask-line { white-space: pre-wrap; overflow-wrap: anywhere; }
  /* 本轮的预算/已花是进度区里的一行仪表：数字等宽，跑动时不跳列。
     行数多到要滚动时仍钉在进度区顶部；接近或达到预算上限时整行转成
     危险色，done 之后也保留这一行。 */
  .ask-line.ask-meter {
    position: sticky;
    top: 0;
    z-index: 1;
    padding: 1px 0 4px;
    background: var(--surface-2);
    font-variant-numeric: tabular-nums;
  }
  .ask-line.is-near-budget { color: var(--danger); font-weight: 600; }
  .ask-row { display: flex; align-items: flex-end; gap: 10px; }

  /* ---- 工作台底栏（SRV6） ----
     底栏从「一个输入框 + 一个按钮」变成两层：上面一层用 chip 说明这一轮
     「在哪跑 / 能不能写 / 问谁 / 跑几轮、花多少」，下面一层才是输入。工具条
     本身不抢输入框的宽度，chip 会自己换行。 */
  .composer { display: flex; flex-direction: column; gap: 8px; }
  .composer-bar {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    min-height: 28px;
  }
  /* chip 是弹层的定位锚：弹层用 position:absolute 挂在它上面，不参与布局。 */
  .chip-wrap { position: relative; display: inline-flex; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    min-height: 28px;
    padding: 3px 10px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    background: var(--surface);
    color: var(--ink-2);
    font: inherit;
    font-size: 12px;
    line-height: 1.4;
    white-space: nowrap;
    cursor: pointer;
    transition: background .12s ease, color .12s ease, border-color .12s ease;
  }
  .chip:hover { background: var(--surface-2); color: var(--ink); }
  .chip:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .chip[aria-expanded="true"] { background: var(--surface-2); color: var(--ink); }
  .chip-icon { font-size: 12px; line-height: 1; }
  .chip-caret { color: var(--muted-2); font-size: 10px; }
  .chip-text {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* 成员是「已选」状态：用强调色浅底把这一轮真正会问的人挑出来。 */
  .chip.member {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
    cursor: default;
  }
  .chip-x {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px; height: 16px;
    margin: 0 -2px 0 1px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: inherit;
    font: inherit;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
  }
  .chip-x:hover { background: var(--surface); color: var(--danger); }
  .chip.add {
    justify-content: center;
    width: 28px;
    padding: 0;
    color: var(--muted);
    font-size: 16px;
  }
  .chip-list { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; min-width: 0; }
  /* 技能 chip 贴在工具条右端：margin-left:auto 吃掉这一行剩下的空白，不挤
     前面的成员 chip；它为 0 时整块 hidden。.chip-wrap 自己有 display:inline-flex，
     会盖过 hidden 属性的 UA 样式，所以这条 [hidden] 必须显式写出来。 */
  .skills-wrap { margin-left: auto; }
  .chip-wrap[hidden] { display: none; }
  .skills-popover { width: 340px; }
  /* 技能 chip 贴在工具条右端，弹层若照默认 left:0 向右展开会伸出视口右侧
     （底栏的右边界就是窗口边界）。所以让它的右边缘对齐 chip 的右边缘。 */
  .skills-wrap .popover { left: auto; right: 0; }
  /* 每条 skill 两行：名字在上，说明在下。说明可能很长，允许在任意位置折行，
     不让一条 description 把弹层撑出横向滚动条。 */
  .skill-row { padding: 7px 8px; border-radius: var(--r-sm); }
  .skill-row + .skill-row { margin-top: 2px; }
  .skill-name { font-size: 12.5px; line-height: 1.4; color: var(--ink); overflow-wrap: anywhere; }
  .skill-desc { margin-top: 2px; font-size: 11.5px; line-height: 1.5; color: var(--muted); overflow-wrap: anywhere; }
  /* 不是菜单项、也不可点：用说明文字的颜色明确它只是备注。 */
  .skills-readonly { padding: 6px 8px 4px; font-size: 11.5px; line-height: 1.5; color: var(--muted-2); }
  .composer-hint { flex-basis: 100%; font-size: 11.5px; color: var(--warn); }
  .composer-hint[hidden] { display: none; }
  /* 这一行说明「跑一轮」会落在哪个会话：选中已有会话＝续接，没选＝新建。
     它是输入行上方的一行小字，不抢输入框的注意力。 */
  .ask-target {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 18px;
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--muted);
  }
  .ask-target-text { min-width: 0; overflow-wrap: anywhere; }
  .ask-target-new {
    padding: 2px 8px;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-sm);
    background: var(--surface);
    color: var(--ink-2);
    font: inherit;
    font-size: 11px;
    line-height: 1.5;
    white-space: nowrap;
    cursor: pointer;
  }
  .ask-target-new:hover { background: var(--surface-2); color: var(--ink); }
  .ask-target-new:disabled { color: var(--muted-2); cursor: default; }
  .ask-target-new[hidden] { display: none; }
  .context-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    font-size: 11.5px;
    color: var(--muted);
  }
  .context-row[hidden] { display: none; }
  .context-row .chip { max-width: min(360px, 60vw); }
  /* 底栏贴着窗口底边：弹层若向下展开，会被视口裁掉一半。所以统一向
     chip 上方翻，视觉上仍紧贴触发它的 chip。 */
  .popover {
    position: absolute;
    left: 0;
    bottom: calc(100% + 8px);
    z-index: 30;
    width: 300px;
    max-width: calc(100vw - 32px);
    max-height: 320px;
    overflow: auto;
    padding: 8px;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-md);
    background: var(--surface);
    box-shadow: var(--shadow);
    color: var(--ink);
  }
  .popover[hidden] { display: none; }
  .popover-title {
    padding: 4px 6px 6px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--muted-2);
  }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 8px;
    border: 0;
    border-radius: var(--r-sm);
    background: transparent;
    color: var(--ink-2);
    font: inherit;
    font-size: 13px;
    text-align: left;
    cursor: pointer;
  }
  .menu-item:hover { background: var(--surface-2); color: var(--ink); }
  .menu-item.is-current { background: var(--accent-soft); color: var(--accent); }
  .menu-item[hidden] { display: none; }
  .menu-empty { padding: 8px; font-size: 12px; line-height: 1.6; color: var(--muted-2); }
  .popover-field { display: flex; flex-direction: column; gap: 6px; padding: 2px; }
  .popover-field label { font-size: 11.5px; color: var(--muted); }
  .popover-field input {
    width: 100%;
    padding: 7px 9px;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-sm);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-size: 12.5px;
  }
  .popover-field input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  /* 参数弹层里的两个下拉与预算输入共用同一套表单样式。 */
  .popover-field select {
    width: 100%;
    padding: 7px 9px;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-sm);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-size: 12.5px;
  }
  .popover-field select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .param-popover { width: 340px; }
  /* 被前端拦住的组合在弹层里就地说明原因，不把错误甩到整页的状态条。 */
  .param-error { padding: 4px 2px 0; font-size: 11.5px; line-height: 1.5; color: var(--danger); }
  .param-error[hidden] { display: none; }
  .popover-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 2px; }
  .btn-small {
    padding: 5px 12px;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-sm);
    background: var(--surface);
    color: var(--ink-2);
    font: inherit;
    font-size: 12px;
    white-space: nowrap;
    cursor: pointer;
  }
  .btn-small:hover { background: var(--surface-2); color: var(--ink); }
  .btn-small.primary { border-color: var(--brand); background: var(--brand); color: var(--brand-ink); }
  .btn-small.primary:hover { opacity: .88; }
  .preset-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px;
    border-radius: var(--r-sm);
  }
  .preset-row:hover { background: var(--surface-2); }
  .preset-name {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 12.5px;
    color: var(--ink);
  }
  .preset-row .btn-small { padding: 3px 8px; font-size: 11.5px; }
  .popover-divider { height: 1px; margin: 6px 2px; background: var(--line); }
  /* 思考中的省略号只动透明度：动画期间不触发布局，进度区不会跟着抖。 */
  .ask-dots { display: inline-flex; gap: 3px; margin-left: 5px; vertical-align: middle; }
  .ask-dots span {
    width: 3px; height: 3px;
    border-radius: 50%;
    background: currentColor;
    animation: ask-blink 1.2s infinite ease-in-out both;
  }
  .ask-dots span:nth-child(2) { animation-delay: .15s; }
  .ask-dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes ask-blink {
    0%, 80%, 100% { opacity: .2; }
    40% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ask-dots span { animation: none; opacity: .6; }
  }

  #ask-prompt {
    flex: 1;
    min-height: 44px;
    max-height: 160px;
    resize: vertical;
    padding: 11px 12px;
    border: 1px solid var(--line-strong);
    border-radius: var(--r-md);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-size: 13.5px;
    line-height: 1.6;
  }
  #ask-prompt:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #ask-run {
    height: 44px;
    min-width: 104px;
    padding: 0 20px;
    border: 0;
    border-radius: var(--r-md);
    background: var(--brand);
    color: var(--brand-ink);
    font: inherit;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    transition: opacity .12s ease;
  }
  #ask-run:hover { opacity: .88; }
  #ask-run:disabled { opacity: .4; cursor: default; }
  .ask-error { color: var(--danger); font-size: 12px; }
  .ask-error[hidden] { display: none; }

  /* 收起右栏：给正文腾地方，状态记在 localStorage 里 */
  #app.no-inspector .workspace { grid-template-columns: 288px minmax(0, 1fr); }
  #app.no-inspector .inspector { display: none; }
  #toggle-cost {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px; height: 28px;
    margin-left: 4px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
  }
  #toggle-cost:hover { background: var(--surface-2); color: var(--ink); }
  .cost[hidden] { display: none; }
  #toggle-inspector {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px; height: 28px;
    margin-left: auto;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
  }
  #toggle-inspector:hover { background: var(--surface-2); color: var(--ink); }
  #app.no-inspector #toggle-inspector { color: var(--ink); background: var(--surface-2); }
  .conv-meta { font-size: 12px; color: var(--muted-2); font-variant-numeric: tabular-nums; }

  /* 每条消息悬停时才出现的复制按钮：平时不占视线 */
  .msg-copy {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 7px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--surface);
    color: var(--muted);
    font: inherit;
    font-size: 11px;
    cursor: pointer;
    opacity: 0;
    transition: opacity .12s ease, color .12s ease;
  }
  .message:hover .msg-copy, .msg-copy:focus-visible { opacity: 1; }
  .msg-copy:hover { color: var(--ink); }
  .msg-foot { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .message.is-user .msg-foot { justify-content: flex-end; }
  .msg-foot time { font-size: 11px; color: var(--muted-2); font-variant-numeric: tabular-nums; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 26px;
    transform: translateX(-50%);
    padding: 8px 16px;
    border-radius: 999px;
    background: var(--brand);
    color: var(--brand-ink);
    font-size: 12.5px;
    box-shadow: 0 8px 28px -12px rgba(15, 17, 21, .5);
    z-index: 20;
  }
  .toast[hidden] { display: none; }

  @media (max-width: 1180px) {
    .workspace { grid-template-columns: 250px minmax(0, 1fr); }
    .inspector { display: none; }
  }
  @media (max-width: 820px) {
    .workspace { grid-template-columns: minmax(0, 1fr); }
    .sidebar { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">Council <small>只读看板</small></div>
    <div id="status" class="status" hidden></div>
    <button id="toggle-inspector" type="button" title="收起/展开「成员与费用」" aria-label="收起或展开成员与费用">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
        <rect x="1.5" y="2.5" width="13" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <path d="M10.5 2.5v11" fill="none" stroke="currentColor" stroke-width="1.4"/>
      </svg>
    </button>
    <button id="toggle-cost" type="button" title="显示/隐藏花费" aria-label="显示或隐藏花费">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
        <circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <path d="M9.6 5.9c-.4-.6-1-1-1.9-1-1.1 0-1.7.5-1.7 1.2 0 .8.7 1.1 1.8 1.4 1.3.3 2.1.7 2.1 1.7 0 .9-.8 1.5-2.1 1.5-.9 0-1.6-.3-2-1" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="cost">
      <span class="cost-note" id="cost-note"></span>
      <span class="cost-value" id="cost-value">—</span>
    </div>
  </header>
  <main class="workspace">
    <aside class="sidebar">
      <div class="side-head">
        <h2>会话</h2>
        <button id="refresh-conversations" type="button" title="重新读一次会话列表" aria-label="刷新会话列表">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
            <path d="M12.6 6.2A5 5 0 1 0 13 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M13.4 3.3v3.1H10.3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <div class="side-search">
        <input id="conversation-search" type="search" autocomplete="off" spellcheck="false"
               placeholder="搜索标题" aria-label="按标题搜索会话">
        <span id="conversation-count" class="side-count" aria-live="polite" hidden></span>
      </div>
      <div class="side-scroll">
        <ul id="conversation-list"></ul>
        <p id="conversations-empty" class="empty" hidden>还没有会话，先在终端里跑一次 council</p>
      </div>
    </aside>

    <section class="conversation">
      <div class="conv-head"><h2 id="messages-title">消息</h2><span id="messages-meta" class="conv-meta"></span></div>
      <div class="conv-scroll">
        <ol id="message-list"></ol>
        <p id="messages-empty" class="empty" hidden></p>
      </div>
    </section>

    <aside class="inspector">
      <div class="side-head"><h2>成员与费用</h2></div>
      <div class="side-scroll">
        <table id="members-table">
          <thead>
            <tr>
              <th>成员</th>
              <th>轮</th>
              <th>IN</th>
              <th>OUT</th>
              <th>金额</th>
            </tr>
          </thead>
          <tbody id="members-body"></tbody>
        </table>
        <p id="members-empty" class="empty" hidden>这个会话还没有成员</p>
      </div>
    </aside>
  </main>

  <section id="ask-panel" class="ask" hidden>
    <div id="ask-progress" class="ask-progress" hidden></div>
    <div class="ask-error" id="ask-error" hidden></div>
    <div class="composer">
      <div id="composer-bar" class="composer-bar" role="toolbar" aria-label="工作台工具">
        <div class="chip-wrap">
          <button id="cwd-chip" class="chip" type="button" aria-haspopup="dialog" aria-expanded="false" title="工作目录"></button>
          <div id="cwd-popover" class="popover" role="dialog" aria-label="工作目录" hidden>
            <div class="popover-title">工作目录</div>
            <div class="popover-field">
              <label for="cwd-input">绝对路径</label>
              <input id="cwd-input" type="text" autocomplete="off" spellcheck="false" placeholder="D:\path\to\project">
              <div class="popover-actions">
                <button id="cwd-apply" class="btn-small primary" type="button">应用</button>
              </div>
            </div>
          </div>
        </div>
        <div class="chip-wrap">
          <button id="permission-chip" class="chip" type="button" aria-haspopup="menu" aria-expanded="false"></button>
          <div id="permission-menu" class="popover" role="menu" aria-label="权限" hidden>
            <button class="menu-item" type="button" role="menuitemradio" data-permission="read">只读</button>
            <button class="menu-item" type="button" role="menuitemradio" data-permission="workspace">可改文件（副本）</button>
          </div>
        </div>
        <div class="chip-wrap">
          <button id="param-chip" class="chip" type="button" aria-haspopup="dialog" aria-expanded="false" title="本轮参数：轮数、汇总成员与预算">
            <span class="chip-icon" aria-hidden="true">⚙</span>
            <span class="chip-text">1 轮 · 默认汇总 · $5</span>
            <span class="chip-caret" aria-hidden="true">▾</span>
          </button>
          <div id="param-popover" class="popover param-popover" role="dialog" aria-label="参数" hidden>
            <div class="popover-title">本轮参数</div>
            <div class="popover-field">
              <label for="param-rounds">轮数（1–5；大于 1 时按 round 模式跑）</label>
              <select id="param-rounds">
                <option value="1">1 轮</option>
                <option value="2">2 轮</option>
                <option value="3">3 轮</option>
                <option value="4">4 轮</option>
                <option value="5">5 轮</option>
              </select>
            </div>
            <div class="popover-field">
              <label for="param-summary">汇总成员</label>
              <select id="param-summary"></select>
            </div>
            <div class="popover-field">
              <label for="param-budget">预算上限（USD，最低 0.5）</label>
              <input id="param-budget" type="number" min="0.5" step="0.01" value="5" autocomplete="off" spellcheck="false">
            </div>
            <div id="param-error" class="param-error" hidden></div>
            <div class="popover-actions">
              <button id="param-apply" class="btn-small primary" type="button">应用</button>
            </div>
          </div>
        </div>
        <div id="member-chips" class="chip-list" aria-label="已选成员"></div>
        <div class="chip-wrap">
          <button id="add-button" class="chip add" type="button" aria-haspopup="menu" aria-expanded="false" title="添加" aria-label="添加">+</button>
          <div id="add-menu" class="popover" role="menu" aria-label="添加" hidden>
            <button class="menu-item" type="button" data-action="members">成员</button>
            <button class="menu-item" type="button" data-action="cwd">工作目录</button>
            <button class="menu-item" type="button" data-action="context">文件或目录引用</button>
            <button class="menu-item" type="button" data-action="presets">预设</button>
          </div>
          <div id="members-popover" class="popover" role="menu" aria-label="成员" hidden></div>
          <div id="context-popover" class="popover" role="dialog" aria-label="文件或目录引用" hidden>
            <div class="popover-title">文件或目录引用</div>
            <div class="popover-field">
              <label for="context-input">绝对路径，回车加入</label>
              <input id="context-input" type="text" autocomplete="off" spellcheck="false" placeholder="D:\repo\main.go">
              <div class="popover-actions">
                <button id="context-add" class="btn-small primary" type="button">加入</button>
              </div>
            </div>
            <div id="context-count" class="menu-empty"></div>
          </div>
          <div id="preset-popover" class="popover" role="dialog" aria-label="预设" hidden>
            <div class="popover-title">预设</div>
            <div class="popover-field">
              <label for="preset-name">把当前成员、目录、权限存成一个名字</label>
              <input id="preset-name" type="text" autocomplete="off" maxlength="60">
              <div class="popover-actions">
                <button id="preset-save" class="btn-small primary" type="button">保存预设</button>
              </div>
            </div>
            <div class="popover-divider"></div>
            <div id="preset-list"></div>
          </div>
        </div>
        <div id="skills-wrap" class="chip-wrap skills-wrap" hidden>
          <button id="skills-chip" class="chip" type="button" aria-haspopup="dialog" aria-expanded="false"></button>
          <div id="skills-popover" class="popover skills-popover" role="dialog" aria-label="技能" hidden>
            <div class="popover-title">技能</div>
            <div id="skills-list"></div>
            <div class="popover-divider"></div>
            <div class="skills-readonly">只读：Council 不执行 skill</div>
          </div>
        </div>
        <div id="composer-hint" class="composer-hint" hidden></div>
      </div>
      <div id="context-row" class="context-row" hidden>
        <span>引用</span>
        <div id="context-tags" class="chip-list"></div>
      </div>
      <div id="ask-target" class="ask-target">
        <span id="ask-target-text" class="ask-target-text">新建会话</span>
        <button id="ask-target-new" class="ask-target-new" type="button" hidden>改为新建</button>
      </div>
      <div class="ask-row">
        <textarea id="ask-prompt" rows="2" placeholder="问这一次议会一个问题…"></textarea>
        <button id="ask-run" type="button" disabled>跑一轮</button>
      </div>
    </div>
  </section>
  <div id="toast" class="toast" hidden></div>
</div>
<script>
(() => {
  'use strict';

  // 消息面板与账仍靠每 3 秒拉一次增量（SRV1 §5）；SSE 只服务写模式的
  // 任务进度，不改变读侧的轮询节奏。
  // 用 setTimeout 串行排队而不是 setInterval：一次请求慢于 3 秒时，
  // setInterval 会叠加出多个在飞请求，慢接口会把看板拖成一串重复渲染。
  const POLL_MS = 3000;
  const PAGE_LIMIT = 1000;

  const state = {
    conversations: [],
    currentId: null,
    // 左侧搜索框的词（原样保存，过滤时再 trim + toLowerCase）。纯前端：
    // 列表本来就已经整份在内存里，一次按键不该打一次接口。
    search: '',
    // 非 null 表示正在原地改名：{ id, draft, error }。draft 由输入框的
    // input 事件同步，这样列表被轮询重画时草稿不会跟着丢。
    rename: null,
    // 用户主动点了「改为新建」之后为 true：此时 currentId 为 null，但
    // 列表刷新不能再自动选中第一条，否则刚切到的「新建」会被下一次
    // refreshConversations 悄悄改回「续接」。显式选会话或开跑即清掉。
    newTarget: false,
    lastSeq: 0,
    detail: null,
    timer: null,
    // 写模式（council serve -rw）才为 true，由 /api/health 的 writable
    // 决定。只读模式下这些字段保持默认，底栏整块 hidden。
    writable: false,
    askRunning: false,
    askSource: null,
    // 工作台（SRV6）的状态。optionsLoaded 用来区分「配置里真的没有
    // agent」与「/api/options 还没回来/读失败」——这两种情况都要禁用
    // 「跑一轮」，但只有前者该显示任务书规定的那句提示。
    optionsLoaded: false,
    agents: [],
    // skills 是 /api/options 里的只读元数据（id / name / description）。
    // 它不参与执行，也不参与任何提交：Council 不跑 skill。
    skills: [],
    cwd: '',
    permission: 'read',
    selectedAgents: [],
    contexts: [],
    // 本轮的三个参数（SRV13）。它们和成员、目录一起进提交体；summary 用
    // 空串表示"配置默认"、用 "none" 表示显式关闭（ask 模式才允许关）。
    // summaryAgent 是 /api/options 给的配置默认汇总成员，只用于下拉文案与
    // round 模式的前端校验，不会直接提交。
    rounds: 1,
    summary: '',
    summaryAgent: '',
    budgetUSD: 5,
    // 运行中的预算仪表：runBudget 在提交那一刻冻结（之后再改参数不影响
    // 正在跑的这场），runSpent 由 SSE 的 turn/done 累加/校正。
    runBudget: null,
    runSpent: 0,
    runMeter: null,
    // 这一场实际使用的汇总成员 id（空串＝不汇总）。SSE 的 turn_started /
    // turn 只为发言轮发；汇总轮没有 turn 事件，done 时要用它把汇总成员
    // 那条「正在思考」收掉，别误报成「未返回结果」。
    runSummaryID: '',
    presets: [],
    jobID: null,
    stopping: false,
    // agent_id -> { line, name }。同一成员多轮会重复 turn_started，
    // 只保留最新那一行，避免进度区堆一串过期的「正在思考」。
    thinking: new Map(),
  };

  const conversationList = document.getElementById('conversation-list');
  const conversationsEmpty = document.getElementById('conversations-empty');
  const conversationSearch = document.getElementById('conversation-search');
  const conversationCount = document.getElementById('conversation-count');
  const messageList = document.getElementById('message-list');
  const messagesEmpty = document.getElementById('messages-empty');
  const messagesTitle = document.getElementById('messages-title');
  const membersBody = document.getElementById('members-body');
  const membersEmpty = document.getElementById('members-empty');
  const costValue = document.getElementById('cost-value');
  const costNote = document.getElementById('cost-note');
  const statusLine = document.getElementById('status');
  const brandNote = document.querySelector('.brand small');
  const askPanel = document.getElementById('ask-panel');
  const askPrompt = document.getElementById('ask-prompt');
  const askRun = document.getElementById('ask-run');
  const askProgress = document.getElementById('ask-progress');
  const askError = document.getElementById('ask-error');
  const cwdChip = document.getElementById('cwd-chip');
  const cwdPopover = document.getElementById('cwd-popover');
  const cwdInput = document.getElementById('cwd-input');
  const cwdApply = document.getElementById('cwd-apply');
  const permissionChip = document.getElementById('permission-chip');
  const permissionMenu = document.getElementById('permission-menu');
  const paramChip = document.getElementById('param-chip');
  const paramPopover = document.getElementById('param-popover');
  const paramRounds = document.getElementById('param-rounds');
  const paramSummary = document.getElementById('param-summary');
  const paramBudget = document.getElementById('param-budget');
  const paramError = document.getElementById('param-error');
  const paramApply = document.getElementById('param-apply');
  const memberChips = document.getElementById('member-chips');
  const skillsWrap = document.getElementById('skills-wrap');
  const skillsChip = document.getElementById('skills-chip');
  const skillsPopover = document.getElementById('skills-popover');
  const skillsList = document.getElementById('skills-list');
  const addButton = document.getElementById('add-button');
  const addMenu = document.getElementById('add-menu');
  const membersPopover = document.getElementById('members-popover');
  const contextPopover = document.getElementById('context-popover');
  const contextInput = document.getElementById('context-input');
  const contextAdd = document.getElementById('context-add');
  const contextCount = document.getElementById('context-count');
  const contextRow = document.getElementById('context-row');
  const contextTags = document.getElementById('context-tags');
  const presetPopover = document.getElementById('preset-popover');
  const presetName = document.getElementById('preset-name');
  const presetSave = document.getElementById('preset-save');
  const presetList = document.getElementById('preset-list');
  const composerHint = document.getElementById('composer-hint');
  const askTargetText = document.getElementById('ask-target-text');
  const askTargetNew = document.getElementById('ask-target-new');
  const messagesMeta = document.getElementById('messages-meta');
  const appRoot = document.getElementById('app');
  const toggleInspector = document.getElementById('toggle-inspector');
  const toast = document.getElementById('toast');

  // 收起右栏是个偏好，不是一次性的动作：刷新之后还应该收着。
  const INSPECTOR_KEY = 'council.inspector.collapsed';
  try {
    if (window.localStorage.getItem(INSPECTOR_KEY) === '1') appRoot.classList.add('no-inspector');
  } catch (err) {
    // 隐私模式禁 localStorage 时按默认展开走，不影响功能。
  }
  toggleInspector.addEventListener('click', () => {
    appRoot.classList.toggle('no-inspector');
    try {
      window.localStorage.setItem(INSPECTOR_KEY, appRoot.classList.contains('no-inspector') ? '1' : '0');
    } catch (err) { /* 同上 */ }
  });

  // 花额是敏感信息：有些人不想让旁边的人一眼看到，给一个记住的开关。
  const costBox = document.querySelector('.cost');
  const toggleCost = document.getElementById('toggle-cost');
  const COST_KEY = 'council.cost.visible';
  try {
    if (window.localStorage.getItem(COST_KEY) === '0') costBox.hidden = true;
  } catch (err) { /* 隐私模式 */ }
  toggleCost.addEventListener('click', () => {
    costBox.hidden = !costBox.hidden;
    try {
      window.localStorage.setItem(COST_KEY, costBox.hidden ? '0' : '1');
    } catch (err) { /* 同上 */ }
  });

  let toastTimer = null;
  function showToast(text) {
    toast.textContent = text;
    toast.hidden = false;
    if (toastTimer !== null) window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(() => { toast.hidden = true; toastTimer = null; }, 2000);
  }

  // 复制：127.0.0.1 是安全上下文，clipboard 可用；老终端里退回 execCommand。
  function copyText(text) {
    if (!text) return;
    const done = () => showToast('已复制 ' + Array.from(text).length + ' 个字符');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, () => legacyCopy(text, done));
      return;
    }
    legacyCopy(text, done);
  }

  function legacyCopy(text, done) {
    const area = document.createElement('textarea');
    area.value = text;
    area.setAttribute('readonly', '');
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    try { document.execCommand('copy'); done(); } catch (err) { showError(err); }
    document.body.removeChild(area);
  }

  function api(path) {
    return fetch(path, { headers: { Accept: 'application/json' } }).then((res) => {
      return res.text().then((text) => {
        let body = null;
        if (text) {
          try {
            body = JSON.parse(text);
          } catch (err) {
            throw new Error('接口返回的不是 JSON');
          }
        }
        if (!res.ok) {
          throw new Error((body && body.error) || ('HTTP ' + res.status));
        }
        return body;
      });
    });
  }

  // postJSON 是写模式唯一会改状态的请求。错误体与只读接口同一个
  // {"error":"…"} 形状，所以能直接复用 api() 的展示逻辑。
  function postJSON(path, payload) {
    return fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify(payload),
    }).then((res) => res.text().then((text) => {
      let body = null;
      if (text) {
        try {
          body = JSON.parse(text);
        } catch (err) {
          throw new Error('接口返回的不是 JSON');
        }
      }
      if (!res.ok) {
        throw new Error((body && body.error) || ('HTTP ' + res.status));
      }
      return body;
    }));
  }

  function showError(err) {
    statusLine.textContent = '连接出错：' + err.message;
    statusLine.hidden = false;
  }

  function clearError() {
    statusLine.hidden = true;
    statusLine.textContent = '';
  }

  function statusText(status) {
    switch (status) {
      case 'ok': return '成功';
      case 'partial': return '部分成功';
      case 'budget_exceeded': return '预算触线';
      case 'error': return '出错';
      default: return status || '未知';
    }
  }

  function showAskError(message) {
    askError.textContent = message;
    askError.hidden = false;
  }

  function clearAskError() {
    askError.textContent = '';
    askError.hidden = true;
  }

  function appendAskProgress(text) {
    const line = document.createElement('div');
    line.className = 'ask-line';
    line.textContent = text;
    askProgress.appendChild(line);
    askProgress.hidden = false;
    askProgress.scrollTop = askProgress.scrollHeight;
    return line;
  }

  // ---- 本轮预算仪表 ----
  // 进度区最上面一行：预算在提交那一刻冻结，已花由 turn 事件累加；
  // done 到达时用后端给的 cost_usd 校正（它把汇总成员也算在总账里）。
  // 花到上限的 90% 起标红并写明「接近上限/已达上限」。
  function startRunMeter() {
    state.runBudget = state.budgetUSD;
    state.runSpent = 0;
    const line = document.createElement('div');
    line.className = 'ask-line ask-meter';
    state.runMeter = line;
    askProgress.appendChild(line);
    askProgress.hidden = false;
    updateRunMeter(0);
  }

  function nearBudget(spent, budget) {
    return typeof budget === 'number' && isFinite(budget) && budget > 0 &&
      typeof spent === 'number' && isFinite(spent) && spent >= budget * 0.9;
  }

  function updateRunMeter(spent) {
    if (!state.runMeter) return false;
    const budget = state.runBudget;
    const near = nearBudget(spent, budget);
    let text = '本轮预算 ' + formatUSDCompact(budget) + ' · 已花 ' + formatUSDCompact(spent);
    if (near) text += spent >= budget ? ' · 已达上限' : ' · 接近上限';
    state.runMeter.textContent = text;
    state.runMeter.classList.toggle('is-near-budget', near);
    return near;
  }

  function clearRunMeter() {
    if (state.runMeter) {
      state.runMeter.remove();
      state.runMeter = null;
    }
    state.runBudget = null;
    state.runSpent = 0;
  }

  // 权限只有整轮两档（SRV5 §2）：只读，或把 cwd 当 git 仓库根、在副本里
  // 改文件。这里不读 agent 自己的 permissions：工作台选的是「这一轮」的
  // 覆盖档，和配置里的静态档是两件事。
  const PERMISSION_LABELS = { read: '只读', workspace: '可改文件（副本）' };
  const CONTEXT_LIMIT = 20;
  const PRESET_KEY = 'council.presets';
  // 与后端规则对齐：rounds 是 1–5 的整数，budget_usd 不得小于 0.5。
  // 后端只约束 budget >= 0.5 与 rounds >= 1；上限 5 是工作台这一片的
  // 产品约束，防止一次误输入把额度放大到不可控。
  const ROUNDS_MIN = 1;
  const ROUNDS_MAX = 5;
  const BUDGET_MIN = 0.5;
  const DEFAULT_BUDGET = 5;

  function basenameOf(path) {
    const raw = String(path || '');
    if (!raw) return '';
    // 同时认 / 与 \：前端不假设 serve 跑在哪种系统上，路径可能是哪一种。
    const parts = raw.replace(/[\\/]+$/, '').split(/[\\/]+/);
    return parts[parts.length - 1] || raw;
  }

  function agentEntry(agentID) {
    return state.agents.find((agent) => agent.id === agentID) || null;
  }

  function memberLabel(agent) {
    if (!agent) return '';
    return [agent.display_name || agent.id, agent.model].filter(Boolean).join(' · ');
  }

  function agentDisplayName(agentID) {
    const agent = agentEntry(agentID);
    return (agent && agent.display_name) || agentID;
  }

  // ---- 弹层 ----
  // 同一时间只开一个：工具条上的弹层入口多，两个叠着会让人不知道点击落进哪层。
  let openPanel = null;
  // 左侧列表的「⋯」菜单。与工具条弹层分开一个变量，但同样一次只开一个：
  // 打开一侧时关掉另一侧，比同屏两个浮层各自响应 Escape 更好预料。
  let openConversationMenu = null;

  function closePopover() {
    if (!openPanel) return;
    openPanel.panel.hidden = true;
    if (openPanel.trigger) openPanel.trigger.setAttribute('aria-expanded', 'false');
    openPanel = null;
  }

  function openPopover(panel, trigger) {
    closeConversationMenu();
    if (openPanel && openPanel.panel !== panel) closePopover();
    panel.hidden = false;
    if (trigger) trigger.setAttribute('aria-expanded', 'true');
    openPanel = { panel: panel, trigger: trigger };
  }

  function togglePopover(panel, trigger) {
    if (panel.hidden) {
      openPopover(panel, trigger);
    } else {
      closePopover();
    }
  }

  // 点弹层内部不关闭：菜单项常常还要打开下一层（成员 / 目录 / 引用 / 预设），
  // 若同一次点击先开再关，用户会看到面板闪一下。
  //
  // 用 composedPath 而不是 target.closest：成员菜单项点完会把列表重画，
  // 被点的按钮已经从 DOM 上摘下来；此刻再沿 target 往上找 .chip-wrap
  // 会找不到祖先，于是把刚打开的面板误关掉。事件派发时算好的路径不会
  // 因为处理函数改了 DOM 而失效。
  document.addEventListener('click', (event) => {
    if (!openPanel) return;
    const inside = event.composedPath().some((node) =>
      node instanceof Element && node.classList.contains('chip-wrap'));
    if (inside) return;
    closePopover();
  });

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && openPanel) closePopover();
  });

  // 会话「⋯」菜单的外点关闭。用节点同一性而不是 class：列表会重画，
  // 但菜单与触发按钮在同一个事件派发路径里仍是这两个对象。
  document.addEventListener('click', (event) => {
    if (!openConversationMenu) return;
    const path = event.composedPath();
    if (path.includes(openConversationMenu.menu) || path.includes(openConversationMenu.trigger)) return;
    closeConversationMenu();
  });

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && openConversationMenu) closeConversationMenu();
  });

  // ---- 工具条渲染 ----
  function renderCwdChip() {
    cwdChip.replaceChildren();
    const icon = document.createElement('span');
    icon.className = 'chip-icon';
    icon.setAttribute('aria-hidden', 'true');
    icon.textContent = '📁';
    const name = document.createElement('span');
    name.className = 'chip-text';
    // 只露最后一段：工作目录常常很长，整条塞进工具条会把别的 chip 挤走；
    // 完整路径放在 title 里，悬浮就能核对。
    name.textContent = basenameOf(state.cwd) || '工作目录';
    cwdChip.appendChild(icon);
    cwdChip.appendChild(name);
    cwdChip.title = state.cwd || '设置这一轮的工作目录';
  }

  function renderPermissionChip() {
    permissionChip.replaceChildren();
    const icon = document.createElement('span');
    icon.className = 'chip-icon';
    icon.setAttribute('aria-hidden', 'true');
    icon.textContent = state.permission === 'workspace' ? '📝' : '🔒';
    const label = document.createElement('span');
    label.className = 'chip-text';
    label.textContent = PERMISSION_LABELS[state.permission] || PERMISSION_LABELS.read;
    const caret = document.createElement('span');
    caret.className = 'chip-caret';
    caret.setAttribute('aria-hidden', 'true');
    caret.textContent = '▾';
    permissionChip.appendChild(icon);
    permissionChip.appendChild(label);
    permissionChip.appendChild(caret);
    permissionChip.title = state.permission === 'workspace'
      ? '成员在隔离副本里跑，可以改副本里的文件'
      : '成员只读讨论，不改任何文件';

    const items = permissionMenu.querySelectorAll('[data-permission]');
    for (const item of items) {
      const current = item.dataset.permission === state.permission;
      item.classList.toggle('is-current', current);
      item.setAttribute('aria-checked', current ? 'true' : 'false');
    }
  }

  // ---- 本轮参数（轮数 / 汇总成员 / 预算） ----
  // 三样都跟着 /api/ask 一起提交：rounds>1 由后端翻成 round 模式；
  // summary 空串＝配置里的 [summary].agent，"none"＝显式不汇总；
  // budget_usd 是这一场的硬上限。
  function paramSummaryShort() {
    if (state.summary === 'none') return '不汇总';
    if (state.summary === '') return '默认汇总';
    return '汇总 ' + agentDisplayName(state.summary);
  }

  function paramChipText() {
    return state.rounds + ' 轮 · ' + paramSummaryShort() + ' · ' + formatUSDCompact(state.budgetUSD);
  }

  function renderParamChip() {
    paramChip.replaceChildren();
    const icon = document.createElement('span');
    icon.className = 'chip-icon';
    icon.setAttribute('aria-hidden', 'true');
    icon.textContent = '⚙';
    const label = document.createElement('span');
    label.className = 'chip-text';
    label.textContent = paramChipText();
    const caret = document.createElement('span');
    caret.className = 'chip-caret';
    caret.setAttribute('aria-hidden', 'true');
    caret.textContent = '▾';
    paramChip.appendChild(icon);
    paramChip.appendChild(label);
    paramChip.appendChild(caret);
    paramChip.title = '参数：' + label.textContent;
    paramChip.setAttribute('aria-label', '参数：' + label.textContent);
  }

  // 汇总下拉的第一项永远是「配置默认（<summary_agent>）」，值为空串；
  // 第二项是显式关闭，值为 "none"；其余每个 agent 一项，显示 display_name。
  function renderParamSummaryOptions() {
    paramSummary.replaceChildren();
    const fallback = document.createElement('option');
    fallback.value = '';
    fallback.textContent = '配置默认（' + (state.summaryAgent || '未配置') + '）';
    paramSummary.appendChild(fallback);

    const none = document.createElement('option');
    none.value = 'none';
    none.textContent = '不汇总';
    paramSummary.appendChild(none);

    for (const agent of state.agents) {
      const option = document.createElement('option');
      option.value = agent.id;
      option.textContent = agent.display_name || agent.id;
      paramSummary.appendChild(option);
    }

    const known = state.summary === '' || state.summary === 'none' || agentEntry(state.summary) !== null;
    paramSummary.value = known ? state.summary : '';
  }

  function fillParamControls() {
    paramRounds.value = String(state.rounds);
    renderParamSummaryOptions();
    paramBudget.value = String(state.budgetUSD);
    setParamError('');
  }

  function openParamPopover() {
    fillParamControls();
    openPopover(paramPopover, paramChip);
    paramRounds.focus();
  }

  function setParamError(message) {
    paramError.textContent = message;
    paramError.hidden = message === '';
  }

  function clearParamError() {
    setParamError('');
  }

  // 轮数与汇总一改就检查最常踩的那条组合，用户不必先点「应用」才知道
  // round 模式不能关汇总；预算输入仍在失焦/应用时统一校验。
  function refreshParamHint() {
    const values = readParamValues();
    if (values.rounds > 1 && values.summary === 'none') {
      setParamError('多轮必须有汇总成员：不能选「不汇总」');
      return;
    }
    clearParamError();
  }

  function readParamValues() {
    const text = paramBudget.value.trim();
    return {
      rounds: Number(paramRounds.value),
      summary: paramSummary.value,
      budget: text === '' ? NaN : Number(text),
    };
  }

  // 与 headless.Validate / resolveSummary 的前端同口径：
  //   - rounds 是 1–5 的整数（上限是本片的产品约束）；
  //   - budget 是有限数且 >= 0.5；
  //   - summary 只能是空串、"none" 或配置里的一个 agent；
  //   - round 模式（rounds>1）必须有汇总：不能 none，配置默认也不能为空。
  function validateParamValues(rounds, summary, budget) {
    if (!Number.isInteger(rounds) || rounds < ROUNDS_MIN || rounds > ROUNDS_MAX) {
      return '轮数必须是 ' + ROUNDS_MIN + '–' + ROUNDS_MAX + ' 的整数';
    }
    if (typeof budget !== 'number' || !isFinite(budget) || budget < BUDGET_MIN) {
      return '预算必须是大于等于 ' + BUDGET_MIN + ' 的数字';
    }
    if (summary !== '' && summary !== 'none' && agentEntry(summary) === null) {
      return '汇总成员不在当前配置里，请重新选择';
    }
    if (rounds > 1) {
      if (summary === 'none') {
        return '多轮必须有汇总成员：不能选「不汇总」';
      }
      const effective = summary === '' ? state.summaryAgent : summary;
      if (!effective) {
        return '多轮必须有汇总成员：先选一个汇总成员，或在配置里写 [summary].agent';
      }
    }
    return '';
  }

  function applyParams() {
    const values = readParamValues();
    const message = validateParamValues(values.rounds, values.summary, values.budget);
    if (message) {
      setParamError(message);
      return;
    }
    state.rounds = values.rounds;
    state.summary = values.summary;
    state.budgetUSD = values.budget;
    clearAskError();
    closePopover();
    renderComposer();
  }

  function renderMemberChips() {
    memberChips.replaceChildren();
    for (const id of state.selectedAgents) {
      const agent = agentEntry(id);
      const chip = document.createElement('span');
      chip.className = 'chip member';
      const text = document.createElement('span');
      text.className = 'chip-text';
      text.textContent = agent ? memberLabel(agent) : id;
      chip.appendChild(text);
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'chip-x';
      remove.textContent = '×';
      remove.title = '移除 ' + text.textContent;
      remove.setAttribute('aria-label', remove.title);
      remove.addEventListener('click', () => {
        state.selectedAgents = state.selectedAgents.filter((item) => item !== id);
        renderComposer();
      });
      chip.appendChild(remove);
      memberChips.appendChild(chip);
    }
  }

  // ---- 技能（只读展示） ----
  // Council 不执行、也不注入 skill：这个 chip 只让用户看见 .claude/skills
  // 里有什么，不参与 /api/ask，列表项因此不是按钮、没有任何点击行为。
  // 数量为 0 时整块不出现（连触发它的 chip 一起收掉）。
  function renderSkillsChip() {
    const total = state.skills.length;
    skillsWrap.hidden = total === 0;
    skillsChip.replaceChildren();
    skillsList.replaceChildren();
    if (total === 0) {
      // chip 不出现时把面板也收掉，免得它悬在一个已经没有触发器的位置。
      if (openPanel && openPanel.panel === skillsPopover) closePopover();
      return;
    }

    const icon = document.createElement('span');
    icon.className = 'chip-icon';
    icon.setAttribute('aria-hidden', 'true');
    icon.textContent = '🧩';
    const label = document.createElement('span');
    label.className = 'chip-text';
    label.textContent = '技能 ' + total;
    const caret = document.createElement('span');
    caret.className = 'chip-caret';
    caret.setAttribute('aria-hidden', 'true');
    caret.textContent = '▾';
    skillsChip.appendChild(icon);
    skillsChip.appendChild(label);
    skillsChip.appendChild(caret);
    skillsChip.title = '配置里可见的 ' + total + ' 个 skill：只读展示，Council 不执行';

    for (const skill of state.skills) {
      const row = document.createElement('div');
      row.className = 'skill-row';
      const name = document.createElement('div');
      name.className = 'skill-name';
      name.textContent = skill.name || skill.id || '(未命名)';
      row.appendChild(name);
      // 副行是 description；没有就退到 id（name 与 description 都是可选字段）。
      const description = skill.description || skill.id || '';
      if (description) {
        const desc = document.createElement('div');
        desc.className = 'skill-desc';
        desc.textContent = description;
        row.appendChild(desc);
      }
      skillsList.appendChild(row);
    }
  }

  function renderContextTags() {
    contextTags.replaceChildren();
    contextRow.hidden = state.contexts.length === 0;
    state.contexts.forEach((path, index) => {
      const chip = document.createElement('span');
      chip.className = 'chip';
      const text = document.createElement('span');
      text.className = 'chip-text';
      text.textContent = path;
      text.title = path;
      chip.appendChild(text);
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'chip-x';
      remove.textContent = '×';
      remove.title = '移除引用 ' + path;
      remove.setAttribute('aria-label', remove.title);
      remove.addEventListener('click', () => {
        state.contexts.splice(index, 1);
        renderComposer();
      });
      chip.appendChild(remove);
      contextTags.appendChild(chip);
    });
  }

  function updateContextCount() {
    contextCount.textContent = state.contexts.length === 0
      ? '还没有引用，最多 ' + CONTEXT_LIMIT + ' 条'
      : '已加 ' + state.contexts.length + ' 条，最多 ' + CONTEXT_LIMIT + ' 条';
  }

  function updateRunButton() {
    if (!state.askRunning) {
      askRun.textContent = '跑一轮';
      askRun.disabled = !state.optionsLoaded || state.agents.length === 0;
      askRun.title = askRun.disabled ? '配置里还没有可选的 agent' : '';
      return;
    }
    if (state.stopping) {
      askRun.textContent = '正在停止…';
      askRun.disabled = true;
      askRun.title = '已发出取消请求，等待当前任务收尾';
      return;
    }
    askRun.textContent = '停止';
    askRun.disabled = false;
    askRun.title = '停止这一轮；已经跑完的成员回复会保留';
  }

  function renderComposer() {
    if (!state.writable) return;
    renderCwdChip();
    renderPermissionChip();
    renderParamChip();
    renderMemberChips();
    renderContextTags();
    renderSkillsChip();

    let hint = '';
    if (state.optionsLoaded && state.agents.length === 0) {
      hint = '配置里还没有 agent，先在终端 /add 或编辑 config.toml';
    } else if (!state.optionsLoaded) {
      hint = '还没读到工作台选项，刷新页面重试';
    }
    composerHint.textContent = hint;
    composerHint.hidden = hint === '';

    if (!contextPopover.hidden) updateContextCount();
    updateRunButton();
  }

  // ---- 成员选择 ----
  // 默认一个都不选：选成员等于授权花钱，默认全选会让一次误点直接开跑。
  function renderMemberPicker() {
    membersPopover.replaceChildren();
    const title = document.createElement('div');
    title.className = 'popover-title';
    title.textContent = '成员';
    membersPopover.appendChild(title);

    const available = state.agents.filter((agent) => !state.selectedAgents.includes(agent.id));
    if (available.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'menu-empty';
      empty.textContent = '没有更多成员';
      membersPopover.appendChild(empty);
      return;
    }
    for (const agent of available) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'menu-item';
      button.textContent = memberLabel(agent);
      button.addEventListener('click', () => {
        if (!state.selectedAgents.includes(agent.id)) state.selectedAgents.push(agent.id);
        renderComposer();
        renderMemberPicker();
        // 列表重画会丢掉焦点：落到下一个可加成员上，键盘连续添加不用再 Tab 一圈。
        const next = membersPopover.querySelector('.menu-item');
        if (next) next.focus();
        else addButton.focus();
      });
      membersPopover.appendChild(button);
    }
  }

  // ---- 预设（只存 localStorage，不落服务端） ----
  // 预设里的参数都是用户可改的 localStorage 数据：越界或类型不对时退回
  // 默认值，不能让一条脏预设把提交体带成后端必然 400 的形状。
  function normalizeRounds(value) {
    return Number.isInteger(value) && value >= ROUNDS_MIN && value <= ROUNDS_MAX ? value : 1;
  }

  function normalizeBudget(value) {
    return typeof value === 'number' && isFinite(value) && value >= BUDGET_MIN ? value : DEFAULT_BUDGET;
  }

  function normalizeSummary(value) {
    if (value === 'none') return 'none';
    if (typeof value === 'string' && agentEntry(value) !== null) return value;
    return '';
  }

  function readPresets() {
    try {
      const raw = window.localStorage.getItem(PRESET_KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return [];
      // 只认已知字段：localStorage 是用户可改的，脏数据不该让底栏崩掉。
      return parsed.filter((item) => item && typeof item.name === 'string').map((item) => ({
        name: item.name,
        members: Array.isArray(item.members) ? item.members.filter((id) => typeof id === 'string') : [],
        cwd: typeof item.cwd === 'string' ? item.cwd : '',
        permission: item.permission === 'workspace' ? 'workspace' : 'read',
        rounds: normalizeRounds(item.rounds),
        summary: typeof item.summary === 'string' ? item.summary : '',
        budget_usd: normalizeBudget(item.budget_usd),
      }));
    } catch (err) {
      return [];
    }
  }

  function writePresets() {
    try {
      window.localStorage.setItem(PRESET_KEY, JSON.stringify(state.presets));
    } catch (err) {
      // 隐私模式禁写 localStorage 时预设仍在本页内存里可用，只是刷新会丢。
      showToast('浏览器不允许写入本地存储，预设只在本次页面有效');
    }
  }

  function renderPresetList() {
    presetList.replaceChildren();
    if (state.presets.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'menu-empty';
      empty.textContent = '还没有预设';
      presetList.appendChild(empty);
      return;
    }
    for (const preset of state.presets) {
      const row = document.createElement('div');
      row.className = 'preset-row';
      const name = document.createElement('span');
      name.className = 'preset-name';
      name.textContent = preset.name;
      name.title = preset.name;
      row.appendChild(name);

      const apply = document.createElement('button');
      apply.type = 'button';
      apply.className = 'btn-small';
      apply.textContent = '套用';
      apply.addEventListener('click', () => applyPreset(preset));
      row.appendChild(apply);

      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'btn-small';
      remove.textContent = '删除';
      remove.addEventListener('click', () => deletePreset(preset.name));
      row.appendChild(remove);

      presetList.appendChild(row);
    }
  }

  function savePreset() {
    const fallback = '预设 ' + (state.presets.length + 1);
    const name = presetName.value.trim() || fallback;
    const preset = {
      name: name,
      members: state.selectedAgents.slice(),
      cwd: state.cwd,
      permission: state.permission,
      rounds: state.rounds,
      summary: state.summary,
      budget_usd: state.budgetUSD,
    };
    const existing = state.presets.findIndex((item) => item.name === name);
    if (existing >= 0) state.presets[existing] = preset;
    else state.presets.push(preset);
    writePresets();
    renderPresetList();
    showToast(existing >= 0 ? '预设已更新：' + name : '预设已保存：' + name);
  }

  function applyPreset(preset) {
    const known = new Set(state.agents.map((agent) => agent.id));
    state.selectedAgents = preset.members.filter((id) => known.has(id));
    state.cwd = preset.cwd;
    state.permission = preset.permission === 'workspace' ? 'workspace' : 'read';
    const rounds = normalizeRounds(preset.rounds);
    let summary = normalizeSummary(preset.summary);
    const budget = normalizeBudget(preset.budget_usd);
    const notes = [];
    const missing = preset.members.length - state.selectedAgents.length;
    if (missing > 0) notes.push(missing + ' 位成员已不在配置里');
    if (preset.summary === 'none' && rounds > 1) {
      // round 模式不允许关汇总：旧预设或手改的 localStorage 不能把界面
      // 带进一个按「跑一轮」必然 400 的状态。
      summary = '';
      notes.push('多轮不能关闭汇总，已改回配置默认');
    } else if (preset.summary && preset.summary !== 'none' && summary === '') {
      notes.push('汇总成员已不在配置里，已改回配置默认');
    }
    if (rounds > 1 && summary === '' && !state.summaryAgent) {
      notes.push('多轮需要汇总成员，请先选一个');
    }
    state.rounds = rounds;
    state.summary = summary;
    state.budgetUSD = budget;
    renderComposer();
    closePopover();
    // 套用不自动提交：用户还要看一眼成员与目录，再自己按「跑一轮」。
    showToast('已套用「' + preset.name + '」' +
      (notes.length > 0 ? '，' + notes.join('，') : ''));
  }

  function deletePreset(name) {
    state.presets = state.presets.filter((item) => item.name !== name);
    writePresets();
    renderPresetList();
    showToast('已删除预设：' + name);
  }

  // ---- 文件 / 目录引用 ----
  function addContext(raw) {
    const path = String(raw || '').trim();
    if (!path) return;
    // 后端也拦 20 条，这里先拦是为了不让第 21 条看起来「加进去了」。
    if (state.contexts.length >= CONTEXT_LIMIT) {
      showAskError('最多 ' + CONTEXT_LIMIT + ' 条');
      return;
    }
    state.contexts.push(path);
    contextInput.value = '';
    clearAskError();
    renderComposer();
    updateContextCount();
    contextInput.focus();
  }

  // ---- 思考中 ----
  function startThinking(agentID) {
    const previous = state.thinking.get(agentID);
    if (previous) previous.line.remove();
    const name = agentDisplayName(agentID);
    const line = document.createElement('div');
    line.className = 'ask-line ask-thinking';
    line.setAttribute('aria-label', name + ' 正在思考');
    const text = document.createElement('span');
    text.textContent = name + ' 正在思考';
    line.appendChild(text);
    const dots = document.createElement('span');
    dots.className = 'ask-dots';
    dots.setAttribute('aria-hidden', 'true');
    for (let i = 0; i < 3; i += 1) dots.appendChild(document.createElement('span'));
    line.appendChild(dots);
    askProgress.appendChild(line);
    askProgress.hidden = false;
    askProgress.scrollTop = askProgress.scrollHeight;
    state.thinking.set(agentID, { line: line, name: name });
  }

  function outcomeLabel(outcome) {
    switch (outcome) {
      case 'ok': return '成功';
      case 'canceled': return '已取消';
      case 'post_rejected': return '被拒';
      case 'provider_failed': return '失败';
      case 'unparsable': return '输出无法解析';
      case 'timeout': return '超时';
      case 'spawn_failed': return '启动失败';
      case 'refused': return '拒绝';
      case 'lost': return '丢失';
      default: return outcome || '未知';
    }
  }

  function finishThinking(agentID, outcome, costUSD) {
    const pending = state.thinking.get(agentID);
    const text = agentDisplayName(agentID) + ' · ' + outcomeLabel(outcome) + ' · ' + formatUSD(costUSD);
    if (!pending) {
      // turn_started 丢了也不能把结果吞掉：直接补一条结果行。
      appendAskProgress(text);
      return;
    }
    const line = document.createElement('div');
    line.className = 'ask-line';
    line.textContent = text;
    pending.line.replaceWith(line);
    state.thinking.delete(agentID);
  }

  // done 到达时还在转的省略号不会有后续 turn（取消、进程崩、服务端早停）：
  // 统一收成一行「未返回结果」，否则动画会一直转，像任务还没结束。
  function settleThinkingLines() {
    for (const pending of state.thinking.values()) {
      const line = document.createElement('div');
      line.className = 'ask-line';
      line.textContent = pending.name + ' · 未返回结果';
      pending.line.replaceWith(line);
    }
    state.thinking.clear();
  }

  function setAskRunning(running) {
    state.askRunning = running;
    if (!running) {
      state.jobID = null;
      state.stopping = false;
      settleThinkingLines();
    }
    updateRunButton();
    // 跑的时候不允许切目标：提交那一刻的目标已经固定，界面再改只会
    // 让人以为这一轮换了会话。
    renderAskTarget();
  }

  function closeJobStream() {
    if (state.askSource) {
      state.askSource.close();
      state.askSource = null;
    }
  }

  // ---- 事件绑定 ----
  cwdChip.addEventListener('click', () => {
    cwdInput.value = state.cwd;
    const wasOpen = !cwdPopover.hidden;
    togglePopover(cwdPopover, cwdChip);
    if (!wasOpen) {
      cwdInput.focus();
      cwdInput.select();
    }
  });

  function applyCwd() {
    // 这里不校验路径：前端拿不到服务器的文件系统，合法性由 /api/ask 的
    // 400 兜底；过早判死会把「目录稍后才创建」这种情况挡在浏览器里。
    state.cwd = cwdInput.value.trim();
    clearAskError();
    closePopover();
    renderComposer();
  }

  cwdApply.addEventListener('click', applyCwd);
  cwdInput.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
      event.preventDefault();
      applyCwd();
    }
  });

  permissionChip.addEventListener('click', () => {
    togglePopover(permissionMenu, permissionChip);
  });
  permissionMenu.addEventListener('click', (event) => {
    const target = event.target;
    if (!(target instanceof Element)) return;
    const item = target.closest('[data-permission]');
    if (!item) return;
    state.permission = item.dataset.permission === 'workspace' ? 'workspace' : 'read';
    closePopover();
    renderComposer();
  });

  paramChip.addEventListener('click', () => {
    const wasOpen = !paramPopover.hidden;
    if (!wasOpen) fillParamControls();
    togglePopover(paramPopover, paramChip);
    if (!wasOpen) paramRounds.focus();
  });
  paramApply.addEventListener('click', applyParams);
  paramBudget.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
      event.preventDefault();
      applyParams();
    }
  });
  paramRounds.addEventListener('change', refreshParamHint);
  paramSummary.addEventListener('change', refreshParamHint);
  paramBudget.addEventListener('input', clearParamError);

  addButton.addEventListener('click', () => {
    togglePopover(addMenu, addButton);
  });
  skillsChip.addEventListener('click', () => {
    togglePopover(skillsPopover, skillsChip);
  });
  addMenu.addEventListener('click', (event) => {
    const target = event.target;
    if (!(target instanceof Element)) return;
    const item = target.closest('[data-action]');
    if (!item) return;
    switch (item.dataset.action) {
      case 'members':
        renderMemberPicker();
        openPopover(membersPopover, addButton);
        break;
      case 'cwd':
        cwdInput.value = state.cwd;
        openPopover(cwdPopover, cwdChip);
        cwdInput.focus();
        cwdInput.select();
        break;
      case 'context':
        updateContextCount();
        openPopover(contextPopover, addButton);
        contextInput.focus();
        break;
      case 'presets':
        presetName.value = '预设 ' + (state.presets.length + 1);
        renderPresetList();
        openPopover(presetPopover, addButton);
        presetName.focus();
        presetName.select();
        break;
      default:
        break;
    }
  });

  contextAdd.addEventListener('click', () => addContext(contextInput.value));
  contextInput.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
      event.preventDefault();
      addContext(contextInput.value);
    }
  });

  presetSave.addEventListener('click', savePreset);
  presetName.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
      event.preventDefault();
      savePreset();
    }
  });

  // 预设是浏览器本地偏好，读失败按「没有预设」走，不能拖住整页。
  state.presets = readPresets();

  async function loadOptions() {
    // 一次拿全：目录、可选成员、team 与配置路径都在这份响应里（SRV5 §1）。
    try {
      const options = await api('/api/options');
      state.optionsLoaded = true;
      state.agents = Array.isArray(options && options.agents)
        ? options.agents.filter((agent) => agent && agent.active !== false)
        : [];
      state.summaryAgent = options && typeof options.summary_agent === 'string'
        ? options.summary_agent
        : '';
      // 预设在 options 之前就读进来了，若指定的汇总成员已从配置里删掉，
      // 这里退回「配置默认」，避免下拉里挂着一个不存在的值。
      if (state.summary !== '' && state.summary !== 'none' && agentEntry(state.summary) === null) {
        state.summary = '';
      }
      // skills 只做展示：只认字符串字段、丢掉形状不对的条目，坏一条不该
      // 让整个底栏崩掉。id 与 name 都空的条目没有可展示的内容，直接丢。
      state.skills = (Array.isArray(options && options.skills) ? options.skills : [])
        .filter((skill) => skill && typeof skill === 'object')
        .map((skill) => ({
          id: typeof skill.id === 'string' ? skill.id : '',
          name: typeof skill.name === 'string' ? skill.name : '',
          description: typeof skill.description === 'string' ? skill.description : '',
        }))
        .filter((skill) => skill.id !== '' || skill.name !== '');
      state.cwd = options && typeof options.cwd === 'string' ? options.cwd : '';
      clearAskError();
    } catch (err) {
      state.optionsLoaded = false;
      state.agents = [];
      state.skills = [];
      state.summaryAgent = '';
      showAskError('读取工作台选项失败：' + err.message);
    }
    renderComposer();
  }

  async function loadHealth() {
    try {
      const health = await api('/api/health');
      state.writable = health && health.writable === true;
    } catch (err) {
      state.writable = false;
    }
    askPanel.hidden = !state.writable;
    if (state.writable) {
      // 只读模式的标题与空库文案一个字都不动；写模式把「只读」改成
      // 事实，免得用户看着「只读看板」不敢在下面输入。
      brandNote.textContent = '写模式';
      document.title = 'Council 写模式';
      conversationsEmpty.textContent = '还没有会话，问一句就会新建';
      // 选项回来之前先按「不可提交」画一次：工具条已经露出，按钮不能有一
      // 瞬间是可按的（那一下用户点了也只会得到一句「还没读到选项」）。
      updateRunButton();
      await loadOptions();
    }
  }

  // subscribeJob 把一次任务的一生接到页面上。done 之后主动 close：
  // 服务端在任务结束后会关流，EventSource 默认会把它当成断线并自动
  // 重连、把整段历史再放一遍；主动关闭才是「已完成」的正确收尾。
  function subscribeJob(jobID) {
    closeJobStream();
    const source = new EventSource('/api/jobs/' + encodeURIComponent(jobID) + '/events');
    state.askSource = source;

    source.addEventListener('started', (event) => {
      let data = null;
      try {
        data = JSON.parse(event.data);
      } catch (err) {
        showAskError('started 事件不是合法 JSON');
        return;
      }
      if (!data.conversation_id) return;
      appendAskProgress('开始 · 会话 ' + data.conversation_id);
      // 续接时目标会话已经在当前面板里：不能再 selectConversation，
      // 那会把 lastSeq 归零、清空消息再整页重拉。这里只刷新列表并
      // 立刻做一次增量拉取，新问题和回复按 seq 接在原来的消息后面。
      const alreadyShowing = state.currentId === data.conversation_id;
      state.currentId = data.conversation_id;
      state.newTarget = false;
      renderConversationList();
      api('/api/conversations').then((list) => {
        state.conversations = list;
        renderConversationList();
        if (state.currentId !== data.conversation_id) return;
        if (alreadyShowing) {
          stopPolling();
          pollOnce();
          return;
        }
        // 新会话才需要切过去：清空旧面板、拉第一页并开始轮询。
        selectConversation(data.conversation_id);
      }).catch(showError);
    });

    // 成员进程真正启动时才发；同一成员多轮会多次到达，每次重新点亮那一行。
    source.addEventListener('turn_started', (event) => {
      let data = null;
      try {
        data = JSON.parse(event.data);
      } catch (err) {
        return;
      }
      if (!data || !data.agent_id) return;
      startThinking(data.agent_id);
    });

    source.addEventListener('turn', (event) => {
      try {
        const data = JSON.parse(event.data);
        // 先找同一成员的「正在思考」行并原位替换，进度区里一个成员始终
        // 只占一行；没有那一行（事件丢失）时补一条结果，不吞消息。
        finishThinking(data.agent_id, data.outcome, data.cost_usd);
        if (typeof data.cost_usd === 'number' && isFinite(data.cost_usd)) {
          state.runSpent += data.cost_usd;
          updateRunMeter(state.runSpent);
        }
      } catch (err) {
        // 单帧坏掉不该停掉整条流，也不值得把连接错误的状态条打红。
      }
    });

    source.addEventListener('done', (event) => {
      let data = null;
      try {
        data = JSON.parse(event.data);
      } catch (err) {
        showAskError('done 事件不是合法 JSON');
      }
      closeJobStream();
      // 汇总轮没有 turn 事件：done 里有 summary 正文就说明它真的回复了，
      // 把它那条「正在思考」先摘掉，再走统一的 settleThinkingLines，否则
      // 一次成功的汇总会在进度区留下「未返回结果」。
      if (data && data.summary && state.runSummaryID) {
        const pending = state.thinking.get(state.runSummaryID);
        if (pending) {
          pending.line.remove();
          state.thinking.delete(state.runSummaryID);
        }
      }
      // 先解锁并收掉还在转的「思考中」，再追加收尾行：否则取消场景里
      // 「未返回结果」会排在「完成」后面，看起来像结束后又发生了一件事。
      setAskRunning(false);
      if (data) {
        // done 的 cost_usd 是这一场的总账（含汇总成员），比逐条 turn 累加
        // 更可信：用它校正仪表，再按 90% 阈值决定是否标红。
        const spent = typeof data.cost_usd === 'number' && isFinite(data.cost_usd)
          ? data.cost_usd
          : state.runSpent;
        state.runSpent = spent;
        const near = updateRunMeter(spent) || data.status === 'budget_exceeded';
        if (data.status === 'budget_exceeded' && state.runMeter) {
          state.runMeter.classList.add('is-near-budget');
        }
        const doneLine = appendAskProgress('完成 · ' + statusText(data.status) + ' · ' +
          formatUSD(data.cost_usd) + ' · 失败 ' + data.failed + '/' + data.total);
        if (near) doneLine.classList.add('is-near-budget');
        if (data.summary) appendAskProgress('汇总：' + data.summary);
      }
      // 跑完先刷新左侧列表（条数、最后活动时间），紧接着做一次增量
      // 消息拉取：续接时问题与回复都落在当前会话里，不必再等 3 秒的
      // 下一次轮询，也不会把整个消息面板重拉一遍。
      refreshConversations().then(() => {
        if (!state.currentId) return;
        stopPolling();
        pollOnce();
      });
    });

    source.addEventListener('error', (event) => {
      // 服务端主动发的 error 带 data；EventSource 自己的连接错误没有
      // data。后一种交给浏览器按 Last-Event-ID 自动重连（服务端保留
      // 60 秒事件历史），所以这里只在确有消息时展示原因，不动按钮：
      // 解锁由紧随其后的 done 负责。
      if (!event.data) return;
      let message = '议会出错';
      try {
        message = JSON.parse(event.data).message || message;
      } catch (err) {
        // 保留兜底文案。
      }
      showAskError(message);
      appendAskProgress('错误 · ' + message);
    });
  }

  function requestStop() {
    if (!state.askRunning || state.stopping) return;
    state.stopping = true;
    updateRunButton();
    // 202 还没回来时 jobID 仍为空：等 runAsk 拿到 id 再补发取消，
    // 否则「停止」会在提交窗口里静默失效。
    if (state.jobID) cancelJob(state.jobID);
  }

  function cancelJob(jobID) {
    postJSON('/api/jobs/' + encodeURIComponent(jobID) + '/cancel', {}).then(() => {
      // 202 只表示取消被受理；按钮保持「正在停止…」直到 done 收尾，
      // 因为成员进程真正退出、结果落库都发生在 done 之前。
    }).catch((err) => {
      state.stopping = false;
      updateRunButton();
      showAskError('停止失败：' + err.message);
    });
  }

  async function runAsk() {
    if (!state.writable || state.askRunning) return;
    if (state.agents.length === 0) {
      showAskError(state.optionsLoaded ? '配置里还没有 agent' : '还没读到工作台选项');
      return;
    }
    const prompt = askPrompt.value.trim();
    if (!prompt) {
      showAskError('先写一句要问的问题');
      askPrompt.focus();
      return;
    }
    if (state.selectedAgents.length === 0) {
      showAskError('先选成员');
      renderMemberPicker();
      openPopover(membersPopover, addButton);
      return;
    }
    // 参数闸放在提交之前：非法组合在这里就停住，一个字节都不会发给
    // 后端。正常情况下 applyParams 已经拦过一遍，这里守的是预设 / 配置
    // 变化之后遗留的旧状态。
    const paramMessage = validateParamValues(state.rounds, state.summary, state.budgetUSD);
    if (paramMessage) {
      showAskError('参数不合法：' + paramMessage);
      openParamPopover();
      return;
    }
    clearAskError();
    clearRunMeter();
    askProgress.replaceChildren();
    askProgress.hidden = true;
