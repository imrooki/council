    state.stopping = false;
    state.jobID = null;
    // 汇总成员的最终 id 在提交这一刻冻结：空串回落到 /api/options 的
    // summary_agent，"none" 就是这一场不汇总。done 收「正在思考」时用。
    state.runSummaryID = state.summary === 'none'
      ? ''
      : (state.summary || state.summaryAgent);
    // 提交这一刻的目标就是这一轮的目标；之后再点左侧列表只影响下一轮。
    // 没选中（新建模式）时不带这个键，后端据此走「新建会话」。
    const targetId = state.currentId;
    const payload = {
      prompt: prompt,
      members: state.selectedAgents.slice(),
      rounds: state.rounds,
      // 空串＝配置里的 [summary].agent；"none"＝显式不汇总。
      summary: state.summary,
      // cwd / workspace / context 是 SRV5 的三个新字段；cwd 传空串时
      // 后端回落到 serve 的启动目录，与 options.cwd 是同一个值。
      cwd: state.cwd,
      workspace: state.permission === 'workspace',
      context: state.contexts.slice(),
      budget_usd: state.budgetUSD,
    };
    if (targetId) payload.conversation = targetId;
    setAskRunning(true);
    try {
      const reply = await postJSON('/api/ask', payload);
      if (!reply || !reply.job_id) throw new Error('接口没有返回 job_id');
      state.jobID = reply.job_id;
      startRunMeter();
      appendAskProgress('已提交，等待会话开始…');
      subscribeJob(reply.job_id);
      if (state.stopping) cancelJob(reply.job_id);
    } catch (err) {
      clearRunMeter();
      setAskRunning(false);
      showAskError(err.message);
    }
  }

  // 表格里一列塞不下 "0.0421 USD"：USD 由表头说明，值只留数字。
  function formatUSD(value) {
    if (typeof value !== 'number' || !isFinite(value)) return '—';
    return '$' + value.toFixed(4);
  }
  // chip 与进度仪表用紧凑写法：默认预算显示 "$5" 而不是 "$5.0000"，
  // 小数最多留 4 位、末尾的 0 去掉（1.5 -> "$1.5"）。
  function formatUSDCompact(value) {
    if (typeof value !== 'number' || !isFinite(value)) return '—';
    const fixed = value.toFixed(4).replace(/\.?0+$/, '');
    return '$' + (fixed === '' ? '0' : fixed);
  }
  function formatUSDFull(value) {
    if (typeof value !== 'number' || !isFinite(value)) return '—';
    return value.toFixed(4) + ' USD';
  }

  function formatNumber(value) {
    return typeof value === 'number' && isFinite(value) ? value.toLocaleString('zh-CN') : '0';
  }

  // 记录里时间戳是次要信息：今天的消息只显示时分，跨天的才带日期。
  // 每条都写全年月日会把眼睛从正文上拽走。
  function formatTime(value) {
    if (!value) return '';
    const date = new Date(value);
    if (isNaN(date.getTime())) return value;
    const clock = date.toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit' });
    const now = new Date();
    const sameDay = date.getFullYear() === now.getFullYear()
      && date.getMonth() === now.getMonth()
      && date.getDate() === now.getDate();
    if (sameDay) return clock;
    return date.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit' }) + ' ' + clock;
  }

  // sender 着色：同一 id 永远得到同一个色相；user / system 是保留 id，
  // 固定用中性色，避免把「人」和某个成员混成一种颜色。
  function senderHue(senderID) {
    if (senderID === 'user' || senderID === 'system') return null;
    let hash = 0;
    for (let i = 0; i < senderID.length; i += 1) {
      hash = (hash * 31 + senderID.charCodeAt(i)) >>> 0;
    }
    return hash % 360;
  }

  // 消息行：头像色只用来区分「谁」，正文才是主角。kind 只在它带来额外
  // 信息时显示——给一条 agent 消息再标一遍 "agent" 是重复。
  function renderMessage(message) {
    const article = document.createElement('article');
    const isUser = message.sender_id === 'user';
    const hue = senderHue(message.sender_id);
    article.className = 'message' + (isUser ? ' is-user' : '');

    const who = message.sender_id || '';
    // 用户的消息是右对齐气泡，身份由位置表达，不需要头像；成员才需要色块。
    if (!isUser) {
      const avatar = document.createElement('div');
      avatar.className = 'avatar' + (hue === null ? ' neutral' : '');
      if (hue !== null) avatar.style.setProperty('--hue', String(hue));
      avatar.textContent = (who.slice(0, 1) || '?').toUpperCase();
      article.appendChild(avatar);
    }

    const body = document.createElement('div');
    body.className = 'msg-body';
    const head = document.createElement('div');
    head.className = 'msg-head';

    // 用户的头像已经写着「你」，名字再写一遍就是重复；成员才需要名字。
    if (!isUser) {
      const name = document.createElement('span');
      name.className = 'who';
      name.textContent = who || '(未知)';
      head.appendChild(name);
    }

    const kindName = String(message.kind || '').replace(/[^a-z_]/g, '');
    if (kindName && kindName !== 'user' && kindName !== 'agent') {
      const kind = document.createElement('span');
      kind.className = 'kind';
      kind.textContent = kindName;
      head.appendChild(kind);
    }

    if (!isUser) {
      const time = document.createElement('time');
      time.textContent = formatTime(message.created_at);
      head.appendChild(time);
    }
    body.appendChild(head);

    if (message.text) {
      const text = document.createElement('div');
      text.className = 'msg-text';
      text.textContent = message.text;
      body.appendChild(text);
    }

    // 复制按钮跟着身份走：成员放在名字那一行的右端，用户跟着气泡底部的时间。
    const makeCopy = () => {
      const copy = document.createElement('button');
      copy.type = 'button';
      copy.className = 'msg-copy';
      copy.textContent = '复制';
      copy.title = '复制这条消息的正文';
      copy.addEventListener('click', () => copyText(message.text));
      return copy;
    };
    if (!isUser && message.text) body.querySelector('.msg-head').appendChild(makeCopy());

    const foot = document.createElement('div');
    foot.className = 'msg-foot';
    if (isUser) {
      const time = document.createElement('time');
      time.textContent = formatTime(message.created_at);
      foot.appendChild(time);
      if (message.text) foot.appendChild(makeCopy());
      body.appendChild(foot);
    }

    article.appendChild(body);
    return article;
  }

  function appendMessages(messages, initial) {
    if (!messages || messages.length === 0) return;
    const wasAtBottom = messageList.scrollHeight - messageList.scrollTop - messageList.clientHeight < 40;
    let appended = 0;
    for (const message of messages) {
      // 按 seq 去重：切会话或两个请求竞态时，同一页可能被追加两次；
      // 重复渲染既会让人以为多了消息，也会把左侧条数加错。
      if (typeof message.seq === 'number' && message.seq <= state.lastSeq) continue;
      messageList.appendChild(renderMessage(message));
      appended += 1;
      if (typeof message.seq === 'number' && message.seq > state.lastSeq) {
        state.lastSeq = message.seq;
      }
    }
    if (appended === 0) return;
    messagesEmpty.hidden = true;
    // 轮询到新消息时顺手更新左侧当前会话那一行，不必为了条数与最后活动
    // 再拉一次整个会话列表。初始加载不更新：那份列表本来就是刚读的。
    if (!initial) {
      const conversation = state.conversations.find((item) => item.id === state.currentId);
      if (conversation) {
        // 不能一律 += appended：done 之后先 refreshConversations 把服务端
        // 的准确条数写回来，紧接着的增量拉取会把「服务端已经算过、但本地
        // lastSeq 还没走过」的消息再加一遍。seq 稠密时 last_seq 就是条数，
        // 用它对账；有空洞（将来的软删除）才退回累加。
        if (conversation.last_seq === conversation.message_count) {
          conversation.message_count = state.lastSeq;
        } else {
          conversation.message_count += appended;
        }
        conversation.last_seq = state.lastSeq;
        conversation.last_activity = messages[messages.length - 1].created_at;
        renderConversationList();
      }
    }
    if (initial || wasAtBottom) {
      messageList.scrollTop = messageList.scrollHeight;
    }
  }

  // 这一轮会落在哪个会话：选中了就是续接它，没选中就是新建。
  // 标题优先取左侧列表里的那一份（刷新后最快拿到），列表里还没有
  // 这个 id 时退到已加载的 detail，都没有才显示「(无标题)」，与列表
  // 里空标题的画法一致。
  function conversationTitle(id) {
    const conversation = state.conversations.find((item) => item.id === id);
    if (conversation && conversation.title) return conversation.title;
    if (state.detail && state.detail.id === id && state.detail.title) return state.detail.title;
    return '(无标题)';
  }

  function renderAskTarget() {
    if (state.currentId) {
      askTargetText.textContent = '继续「' + conversationTitle(state.currentId) + '」';
      askTargetNew.hidden = false;
      askTargetNew.disabled = state.askRunning;
      return;
    }
    askTargetText.textContent = '新建会话';
    askTargetNew.hidden = true;
    askTargetNew.disabled = false;
  }

  // ---- 左侧列表：搜索过滤、每项的「⋯」菜单与原地改名 ----

  // 按标题过滤。纯前端、大小写不敏感：中文本没有大小写，同一个
  // toLowerCase 对中英文都成立；列表本来就在 state.conversations 里，
  // 不为一次按键再打一次 /api/conversations。
  function visibleConversations() {
    const query = state.search.trim().toLowerCase();
    if (query === '') return state.conversations;
    return state.conversations.filter((conversation) =>
      String(conversation.title || '').toLowerCase().includes(query));
  }

  function closeConversationMenu() {
    if (!openConversationMenu) return;
    openConversationMenu.menu.hidden = true;
    openConversationMenu.trigger.setAttribute('aria-expanded', 'false');
    openConversationMenu = null;
  }

  // renderRenameBox 把一行换成输入框。回车确认、Esc 取消；
  // 输入过程中的草稿同步进 state.rename.draft，列表被轮询重画也不会丢。
  function renderRenameBox() {
    const box = document.createElement('div');
    box.className = 'rename-box';

    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'rename-input';
    // 不设 maxLength：HTML 的 maxlength 按 UTF-16 码元数截断，一个 emoji
    // 算 2，会在粘贴时悄悄吃掉一半字符；真正的上限按码点在校验里挡，
    // 超了给一句能看懂的报错，而不是默默截短。
    input.value = state.rename.draft;
    input.setAttribute('aria-label', '新的会话标题');
    input.addEventListener('input', () => {
      if (!state.rename) return;
      state.rename.draft = input.value;
      hideRenameError();
    });
    input.addEventListener('keydown', (event) => {
      // 中文输入法用 Enter 选词时也会发 keydown，此时不能当成提交。
      if (event.isComposing) return;
      if (event.key === 'Enter') {
        event.preventDefault();
        commitRename();
      } else if (event.key === 'Escape') {
        event.preventDefault();
        cancelRename();
      }
    });
    box.appendChild(input);

    const hint = document.createElement('span');
    hint.className = 'rename-hint';
    hint.textContent = '回车保存 · Esc 取消';
    box.appendChild(hint);

    const error = document.createElement('span');
    error.className = 'rename-error';
    if (state.rename.error) {
      error.textContent = state.rename.error;
    } else {
      error.hidden = true;
    }
    box.appendChild(error);
    return box;
  }

  function renderConversationButton(conversation) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'conversation' + (conversation.id === state.currentId ? ' active' : '');
    button.dataset.conversationId = conversation.id;

    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = conversation.title || '(无标题)';
    button.appendChild(title);

    const meta = document.createElement('span');
    meta.className = 'meta';
    const bits = [];
    bits.push(conversation.members + ' 人');
    bits.push(conversation.message_count + ' 条');
    if (conversation.last_activity) bits.push(formatTime(conversation.last_activity));
    meta.textContent = bits.join(' · ');
    button.appendChild(meta);

    button.addEventListener('click', () => {
      if (conversation.id !== state.currentId) selectConversation(conversation.id);
    });
    return button;
  }

  // appendConversationMenu 给一行加「⋯」和它的菜单。菜单直接挂在 li 上
  // （li 是 position: relative），不套第二个按钮，免得点菜单时先切了会话。
  function appendConversationMenu(item, conversation) {
    const more = document.createElement('button');
    more.type = 'button';
    more.className = 'conv-more';
    more.textContent = '⋯';
    more.title = '会话操作';
    more.setAttribute('aria-label', '会话操作');
    more.setAttribute('aria-haspopup', 'menu');
    more.setAttribute('aria-expanded', 'false');

    const menu = document.createElement('div');
    menu.className = 'conv-menu';
    menu.setAttribute('role', 'menu');
    menu.hidden = true;

    const rename = document.createElement('button');
    rename.type = 'button';
    rename.className = 'menu-item';
    rename.setAttribute('role', 'menuitem');
    rename.textContent = '重命名';
    rename.addEventListener('click', (event) => {
      event.stopPropagation();
      closeConversationMenu();
      beginRename(conversation);
    });
    menu.appendChild(rename);

    more.addEventListener('click', (event) => {
      event.stopPropagation();
      const opening = menu.hidden;
      closeConversationMenu();
      if (!opening) return;
      closePopover();
      menu.hidden = false;
      more.setAttribute('aria-expanded', 'true');
      openConversationMenu = { menu, trigger: more };
      // 菜单向下展开；这一行快贴到底边时向上翻，别被 .side-scroll 裁掉。
      menu.classList.remove('up');
      const scrollBox = conversationList.closest('.side-scroll');
      if (scrollBox && menu.getBoundingClientRect().bottom > scrollBox.getBoundingClientRect().bottom) {
        menu.classList.add('up');
      }
    });

    item.appendChild(more);
    item.appendChild(menu);
  }

  function renderConversationRow(conversation) {
    const item = document.createElement('li');
    if (state.rename && state.rename.id === conversation.id) {
      item.appendChild(renderRenameBox());
      return item;
    }
    item.appendChild(renderConversationButton(conversation));
    // 只读模式下没有可做的会话动作：不画一个点了必然 405 的菜单。
    if (state.writable) appendConversationMenu(item, conversation);
    return item;
  }

  function renderConversationList() {
    // 轮询把新消息追加进来时会重画整张列表；正在改名的输入框不能跟着
    // 一起消失。先记下焦点，重画后把它放回同一个输入框（草稿在 state 里）。
    const renameFocused = document.activeElement !== null
      && document.activeElement.classList.contains('rename-input');

    // 会话不存在了（理论上不会——本片不做删除）就退出改名，不留下一个
    // 永远提交不了的草稿。
    if (state.rename && !state.conversations.some((conversation) => conversation.id === state.rename.id)) {
      state.rename = null;
    }

    const visible = visibleConversations();
    conversationList.replaceChildren();
    for (const conversation of visible) {
      conversationList.appendChild(renderConversationRow(conversation));
    }

    const total = state.conversations.length;
    conversationCount.hidden = total === 0;
    conversationCount.textContent = total === 0 ? '' : (visible.length + ' / ' + total);
    conversationCount.title = total === 0 ? '' : '匹配 ' + visible.length + ' 场 / 共 ' + total + ' 场';

    if (visible.length === 0) {
      if (total === 0) {
        conversationsEmpty.textContent = state.writable
          ? '还没有会话，问一句就会新建'
          : '还没有会话，先在终端里跑一次 council';
      } else {
        conversationsEmpty.textContent = '没有匹配的会话';
      }
      conversationsEmpty.hidden = false;
    } else {
      conversationsEmpty.hidden = true;
    }

    if (state.rename && renameFocused) focusRenameInput(false);
    renderAskTarget();
  }

  function focusRenameInput(selectAll) {
    const input = conversationList.querySelector('.rename-input');
    if (!input) return;
    input.focus();
    if (selectAll) {
      input.select();
    } else {
      input.setSelectionRange(input.value.length, input.value.length);
    }
  }

  function hideRenameError() {
    if (!state.rename) return;
    state.rename.error = '';
    const error = conversationList.querySelector('.rename-error');
    if (error) error.hidden = true;
  }

  function showRenameError(message) {
    if (!state.rename) return;
    state.rename.error = message;
    const error = conversationList.querySelector('.rename-error');
    if (error) {
      error.textContent = message;
      error.hidden = false;
    }
    focusRenameInput(false);
  }

  function beginRename(conversation) {
    if (!state.writable) {
      showToast('只读模式不能重命名：用 council serve -rw 启动');
      return;
    }
    closeConversationMenu();
    state.rename = { id: conversation.id, draft: conversation.title || '', error: '' };
    renderConversationList();
    focusRenameInput(true);
  }

  function cancelRename() {
    state.rename = null;
    renderConversationList();
  }

  async function commitRename() {
    if (!state.rename) return;
    const id = state.rename.id;
    const title = state.rename.draft.trim();
    if (title === '') {
      showRenameError('标题不能为空：请给出 1–120 个字符的标题');
      return;
    }
    // Array.from 按字符（码点）数，与后端 utf8.RuneCountInString 同口径；
    // string.length 会把一个 emoji 数成 2，让前后端的 120 边界对不上。
    if (Array.from(title).length > 120) {
      showRenameError('标题最长 120 个字符');
      return;
    }
    try {
      const result = await postJSON(
        '/api/conversations/' + encodeURIComponent(id) + '/rename',
        { title });
      // 请求在飞的时候用户可能已经按 Esc 或换了另一行；只清掉还属于
      // 这一次的编辑状态，别把别人的草稿一并抹掉。
      if (state.rename && state.rename.id === id) state.rename = null;
      const conversation = state.conversations.find((item) => item.id === id);
      if (conversation) conversation.title = result.title;
      if (state.detail && state.detail.id === id) state.detail.title = result.title;
      // 标题栏（会话头）与列表是两份 DOM，都得同步；只改列表会让当前
      // 会话的头部继续显示旧标题，直到下一次 selectConversation。
      if (state.currentId === id) messagesTitle.textContent = result.title || '(无标题)';
      renderConversationList();
      showToast('已重命名为「' + result.title + '」');
    } catch (err) {
      // 失败原因留在输入框下面（例如只读模式的 405）：列表保持原样，
      // 用户可以继续改，或按 Esc 退出。
      showRenameError(err.message);
    }
  }

  function renderCost(usage) {
    if (!usage) {
      costValue.textContent = '—';
      costNote.textContent = '';
      costNote.className = 'cost-note';
      return;
    }
    costValue.textContent = formatUSDFull(usage.cost_usd);
    if (usage.complete) {
      costNote.textContent = '金额完整';
      costNote.className = 'cost-note';
    } else {
      costNote.textContent = '金额不完整';
      costNote.title = '有成员的 provider 不报金额，合计只是报了金额的那些轮之和';
      costNote.className = 'cost-note warn';
    }
  }

  function addCell(row, text, className) {
    const cell = document.createElement('td');
    if (className) cell.className = className;
    cell.textContent = text;
    row.appendChild(cell);
  }

  function renderMembers(detail, usage) {
    membersBody.replaceChildren();

    const members = (detail && detail.members) || [];
    const perAgent = (usage && usage.per_agent) || [];
    const byAgent = new Map();
    for (const member of members) byAgent.set(member.agent_id, member);
    for (const row of perAgent) {
      if (!byAgent.has(row.agent_id)) byAgent.set(row.agent_id, null);
    }

    const ids = Array.from(byAgent.keys()).sort();
    if (ids.length === 0) {
      membersEmpty.hidden = false;
      return;
    }
    membersEmpty.hidden = true;

    const usageById = new Map();
    for (const row of perAgent) usageById.set(row.agent_id, row);

    for (const id of ids) {
      const member = byAgent.get(id);
      const row = document.createElement('tr');
      if (member && !member.active) row.className = 'inactive';

      const memberCell = document.createElement('td');
      const name = document.createElement('div');
      name.className = 'member-name';
      name.textContent = (member && member.display_name) || id;
      memberCell.appendChild(name);
      const sub = document.createElement('div');
      sub.className = 'member-sub';
      const provider = (member && member.provider) || (usageById.get(id) || {}).provider || '';
      const model = (usageById.get(id) || {}).model || '';
      const stat = usageById.get(id) || {};
      const suffix = member && !member.active ? ' · 已退出' : '';
      const cacheBits = [];
      if (stat.cache_create) cacheBits.push('建 ' + formatNumber(stat.cache_create));
      if (stat.cache_read) cacheBits.push('读 ' + formatNumber(stat.cache_read));
      const cacheNote = cacheBits.length ? '缓存 ' + cacheBits.join(' / ') : '';
      sub.textContent = [id, provider, model, cacheNote].filter(Boolean).join(' · ') + suffix;
      memberCell.appendChild(sub);
      row.appendChild(memberCell);

      addCell(row, String(stat.turns || 0), 'num');
      addCell(row, formatNumber(stat.in), 'num');
      addCell(row, formatNumber(stat.out), 'num');
      addCell(row, stat.cost_reported === false ? '不报' : formatUSD(stat.cost_usd || 0), 'num');
      membersBody.appendChild(row);
    }
  }

  function resetToEmptyLibrary() {
    state.currentId = null;
    state.lastSeq = 0;
    state.detail = null;
    state.rename = null;
    state.conversations = [];
    renderConversationList();
    messageList.replaceChildren();
    messagesTitle.textContent = '消息';
    messagesMeta.textContent = '';
    // 只读模式下的原文案保持不动；写模式可以直接在下面新建会话，
    // 再让用户「先去终端跑一次」就是把唯一的入口藏起来。
    messagesEmpty.textContent = state.writable
      ? '还没有会话，在下面问一句就会新建一个'
      : '还没有会话，先在终端里跑一次 council';
    messagesEmpty.hidden = false;
    membersBody.replaceChildren();
    membersEmpty.hidden = true;
    renderCost(null);
  }

  // 点「改为新建」：不删任何会话，只是把这一轮的目标从「续接当前会话」
  // 切回「新建」。消息面板没有对应会话可显示，清空并说明下一步做什么；
  // 左侧列表与 state.conversations 保持不动，随时可以点回去。
  function clearConversationSelection() {
    stopPolling();
    state.currentId = null;
    state.newTarget = true;
    state.rename = null;
    state.lastSeq = 0;
    state.detail = null;
    messageList.replaceChildren();
    messagesTitle.textContent = '消息';
    messagesMeta.textContent = '';
    messagesEmpty.textContent = '下一轮会在新会话里开始';
    messagesEmpty.hidden = false;
    membersBody.replaceChildren();
    membersEmpty.hidden = true;
    renderCost(null);
    renderConversationList();
  }

  async function selectConversation(id) {
    // 切会话先停掉已排队的轮询：旧 timer 若在这一页请求完成前触发，会用
    // 新的 currentId 配 lastSeq=0 再拉一遍第一页，和这里撞车。
    stopPolling();
    // 改名草稿属于原来那一行；切到别的会话时退出编辑，不把输入框带到
    // 另一个会话下面。
    if (state.rename && state.rename.id !== id) state.rename = null;
    state.currentId = id;
    // 显式选了一个会话，就不再是「新建」模式；下一次刷新列表也不能
    // 把它改回第一条。
    state.newTarget = false;
    state.lastSeq = 0;
    state.detail = null;
    renderConversationList();
    messageList.replaceChildren();
    messagesEmpty.hidden = true;
    membersBody.replaceChildren();
    membersEmpty.hidden = true;
    renderCost(null);

    const encoded = encodeURIComponent(id);
    // 三份数据各管各的面板：usage 挂了不该让消息也停更，所以不用
    // Promise.all（它把任何一个失败变成整体失败）。
    const [detailRes, usageRes, pageRes] = await Promise.allSettled([
      api('/api/conversations/' + encoded),
      api('/api/conversations/' + encoded + '/usage'),
      api('/api/conversations/' + encoded + '/messages?after=0&limit=' + PAGE_LIMIT),
    ]);
    if (state.currentId !== id) return;
    let failed = false;
    if (detailRes.status === 'fulfilled') {
      state.detail = detailRes.value;
      messagesTitle.textContent = detailRes.value.title || '(无标题)';
      if (pageRes.status === 'fulfilled') {
        const members = (detailRes.value.members || []).filter((m) => m.active).length;
        messagesMeta.textContent = (pageRes.value.messages || []).length + ' 条 · ' + members + ' 位成员';
      }
      // 工作台的成员来自 /api/options，不跟会话走：这里不重画工具条，
      // 否则切换会话会把用户为下一轮挑好的成员恢复成默认。
    } else {
      failed = true;
      showError(detailRes.reason);
    }
    if (usageRes.status === 'fulfilled') {
      renderCost(usageRes.value);
      if (detailRes.status === 'fulfilled') {
        renderMembers(detailRes.value, usageRes.value);
      }
    } else {
      failed = true;
      showError(usageRes.reason);
    }
    if (pageRes.status === 'fulfilled') {
      const page = pageRes.value;
      if (page.messages.length === 0) {
        messagesEmpty.textContent = '这个会话还没有消息';
        messagesEmpty.hidden = false;
      } else {
        appendMessages(page.messages, true);
      }
      if (typeof page.last_seq === 'number' && page.last_seq > state.lastSeq) {
        state.lastSeq = page.last_seq;
      }
    } else {
      failed = true;
      showError(pageRes.reason);
    }
    if (!failed) clearError();
    // detail 里可能才有标题（列表标题为空时），到这里再画一次目标行。
    renderAskTarget();
    schedulePoll();
  }

  async function refreshConversations() {
    try {
      const list = await api('/api/conversations');
      state.conversations = list;
      renderConversationList();
      if (list.length === 0) {
        resetToEmptyLibrary();
        return;
      }
      if (!state.currentId) {
        // 用户刚点了「改为新建」时保持没选中；否则首次加载自动选最近一条。
        if (!state.newTarget) await selectConversation(list[0].id);
      } else if (!list.some((conversation) => conversation.id === state.currentId)) {
        await selectConversation(list[0].id);
      }
      clearError();
    } catch (err) {
      showError(err);
    }
  }

  async function pollOnce() {
    state.timer = null;
    if (document.hidden) return;
    const id = state.currentId;
    if (!id) {
      schedulePoll();
      return;
    }
    const encoded = encodeURIComponent(id);
    const [pageRes, usageRes] = await Promise.allSettled([
      api('/api/conversations/' + encoded + '/messages?after=' +
        encodeURIComponent(String(state.lastSeq)) + '&limit=' + PAGE_LIMIT),
      api('/api/conversations/' + encoded + '/usage'),
    ]);
    if (state.currentId !== id) {
      schedulePoll();
      return;
    }
    let failed = false;
    if (usageRes.status === 'fulfilled') {
      renderCost(usageRes.value);
      renderMembers(state.detail, usageRes.value);
    } else {
      failed = true;
      showError(usageRes.reason);
    }
    if (pageRes.status === 'fulfilled') {
      appendMessages(pageRes.value.messages, false);
      if (typeof pageRes.value.last_seq === 'number' && pageRes.value.last_seq > state.lastSeq) {
        state.lastSeq = pageRes.value.last_seq;
      }
    } else {
      failed = true;
      showError(pageRes.reason);
    }
    if (!failed) clearError();
    schedulePoll();
  }

  function schedulePoll() {
    if (state.timer !== null || document.hidden) return;
    state.timer = window.setTimeout(pollOnce, POLL_MS);
  }

  function stopPolling() {
    if (state.timer !== null) {
      window.clearTimeout(state.timer);
      state.timer = null;
    }
  }

  document.getElementById('refresh-conversations').addEventListener('click', () => {
    refreshConversations();
  });

  // 搜索是纯前端过滤：输入即生效，清空即恢复全部。
  conversationSearch.addEventListener('input', () => {
    // 过滤会重画列表；正在编辑的那一行若被筛掉，输入框就再也回不来，
    // 所以输入搜索词先退出重命名（未提交的草稿不保留），不留死状态。
    state.rename = null;
    state.search = conversationSearch.value;
    closeConversationMenu();
    renderConversationList();
  });

  // Esc 清空搜索并恢复全部，与输入框自身的清除按钮同一个结果。
  conversationSearch.addEventListener('keydown', (event) => {
    if (event.key !== 'Escape' || conversationSearch.value === '') return;
    event.preventDefault();
    conversationSearch.value = '';
    state.rename = null;
    state.search = '';
    renderConversationList();
  });

  askTargetNew.addEventListener('click', () => {
    if (state.askRunning) return;
    clearConversationSelection();
    askPrompt.focus();
  });

  askRun.addEventListener('click', () => {
    if (state.askRunning) requestStop();
    else runAsk();
  });

  // Ctrl/Cmd+Enter 直接提交；单独 Enter 留给换行——问题经常不止一句。
  askPrompt.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
      event.preventDefault();
      runAsk();
    }
  });

  // 页面隐藏时停掉轮询，回到前台立刻补一次再继续；任务书 §5 要求
  // 中途能停，这比在隐藏页里空转省电，也避免后台标签页攒一堆请求。
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      stopPolling();
      return;
    }
    refreshConversations();
    pollOnce();
  });

  // health 先问一次：只有写模式才把底栏放出来。health 失败按只读处理，
  // 看板本来的四个端点照常工作，不必因为一个可选能力把整页变红。
  loadHealth().then(() => refreshConversations()).then(() => {
    if (state.currentId) schedulePoll();
  });
})();
</script>
</body>
</html>
